post:
  summary: Create booking
  operationId: createBooking

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/CreateBookingRequest.yaml"

  responses:
    "201":
      description: Booking created
      content:
        application/json:
          schema:
            $ref: "../schemas/BookingResponse.yaml"

    "400":
      description: Validation error — missing fields or startDate not in future
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
          example:
            code: START_DATE_MUST_BE_IN_FUTURE
            message: Booking startDate must be in the future

    "403":
      description: User is blocked and cannot create bookings
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
          example:
            code: USER_BLOCKED
            message: User 'user-blocked' is blocked and cannot create bookings

    "404":
      description: Vehicle or user not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
          example:
            code: VEHICLE_NOT_FOUND
            message: Vehicle with id vehicle-nonexistent was not found

    "409":
      description: Vehicle already booked or blocked
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
          example:
            code: VEHICLE_NOT_AVAILABLE
            message: Vehicle vehicle-1 is not available for booking
