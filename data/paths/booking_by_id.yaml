get:
  summary: Get booking by id
  operationId: getBookingById

  parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        example: booking-1

  responses:
    "200":
      description: Booking found
      content:
        application/json:
          schema:
            $ref: "../schemas/BookingResponse.yaml"

    "404":
      description: Booking not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
