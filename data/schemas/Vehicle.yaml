type: object

required:
  - vehicleId
  - brand
  - model
  - status

properties:
  vehicleId:
    type: string
    example: vehicle-1

  brand:
    type: string
    example: Toyota

  model:
    type: string
    example: Camry

  status:
    type: string
    enum:
      - AVAILABLE
      - BOOKED
      - MAINTENANCE
    example: AVAILABLE
