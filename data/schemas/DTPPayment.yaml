type: object
properties:
  paymentId:
    type: string
    example: "dtp-payment-1"
  claimId:
    type: string
    example: "claim-1"
  claimantParticipantId:
    type: string
    example: "participant-2"
  amount:
    type: number
    format: double
    example: 78500.0
  status:
    type: string
    enum: [PENDING, CONFIRMED, FAILED]
    example: "PENDING"
  confirmedAt:
    type: string
    format: date-time
    example: null
required: [paymentId, claimId, claimantParticipantId, amount, status]
