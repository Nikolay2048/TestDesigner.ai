type: object
properties:
  assessmentId:
    type: string
    example: "assessment-1"
  claimId:
    type: string
    example: "claim-1"
  expertName:
    type: string
    example: "Сергей Оценщиков"
  scheduledDate:
    type: string
    format: date-time
    example: "2026-05-20T10:00:00Z"
  completedDate:
    type: string
    format: date-time
    example: null
  assessedAmount:
    type: number
    format: double
    example: 0.0
  report:
    type: string
    example: null
  status:
    type: string
    enum: [SCHEDULED, IN_PROGRESS, COMPLETED]
    example: "SCHEDULED"
required: [assessmentId, claimId, expertName, scheduledDate, status]
