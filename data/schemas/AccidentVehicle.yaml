type: object
properties:
  accidentVehicleId:
    type: string
    example: "acc-vehicle-1"
  participantId:
    type: string
    example: "participant-1"
  licensePlate:
    type: string
    example: "А123ВС77"
  brand:
    type: string
    example: "Toyota"
  model:
    type: string
    example: "Camry"
  damageDescription:
    type: string
    example: "Повреждён передний бампер"
  damageAmount:
    type: number
    format: double
    example: 45000.0
required: [accidentVehicleId, participantId, licensePlate, brand, model]
