type: object
properties:
  role:
    type: string
    enum: [CULPRIT, VICTIM, WITNESS]
    example: "CULPRIT"
  name:
    type: string
    example: "Иван Иванов"
  phone:
    type: string
    example: "+79161234567"
  insurancePolicy:
    type: string
    example: "POL-001-2026"
  faultPercentage:
    type: integer
    example: 100
required: [role, name, phone]
