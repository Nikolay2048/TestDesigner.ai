type: object
properties:
  accidentId:
    type: string
    example: "accident-1"
  date:
    type: string
    format: date-time
    example: "2026-05-17T10:00:00Z"
  location:
    type: string
    example: "ул. Ленина 42, Москва"
  description:
    type: string
    example: "Столкновение на перекрёстке"
  status:
    type: string
    enum: [REGISTERED, UNDER_REVIEW, CLOSED]
    example: "REGISTERED"
  participantsCount:
    type: integer
    example: 2
  totalDamageAmount:
    type: number
    format: double
    example: 0.0
required: [accidentId, date, location, status]
