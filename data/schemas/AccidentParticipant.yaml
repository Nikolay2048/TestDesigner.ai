type: object
properties:
  participantId:
    type: string
    example: "participant-1"
  accidentId:
    type: string
    example: "accident-1"
  role:
    type: string
    enum: [CULPRIT, VICTIM, WITNESS]
    example: "CULPRIT"
  name:
    type: string
    example: "Иван Иванов"
  phone:
    type: string
    example: "+79161234567"
  insurancePolicy:
    type: string
    example: "POL-001-2026"
  faultPercentage:
    type: integer
    minimum: 0
    maximum: 100
    example: 100
  status:
    type: string
    enum: [ACTIVE, WITHDRAWN]
    example: "ACTIVE"
required: [participantId, accidentId, role, name, phone]
