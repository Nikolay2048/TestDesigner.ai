# ═══════════════════════════════════════════════════════════════════════
# KB-014 — Создание отчёта о повреждении автомобиля после аренды
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-014
title: "Создание damage report по завершённой аренде"
type: positive
category: damage_reports
chain_id: POS-014

source_files:
  business_requirements: "data/cases/case_014_damage_report_after_rental/01_business_requirements.md"
  system_analysis: "data/cases/case_014_damage_report_after_rental/02_system_analysis.md"
  openapi: "data/cases/case_014_damage_report_after_rental/03_openapi.yaml"
  flk_rules: "data/cases/case_014_damage_report_after_rental/04_flk_rules.yaml"
  status_matrix: "data/cases/case_014_damage_report_after_rental/05_status_transition_matrix.yaml"

summary: >
  Damage report создаётся только для аренд в статусах FINISHED, PAID, PAYMENT_FAILED.
  Для активной аренды (STARTED) → 409 RENTAL_NOT_CLOSED.
  Обязательные поля: rentalId, vehicleId, description.
  Поле severity опциональное: LOW | MEDIUM | HIGH | CRITICAL (дефолт MEDIUM).
  Невалидный severity → 422 DAMAGE_SEVERITY_INVALID.
  Отсутствие любого обязательного поля → 422.
  После создания: DAMAGE_REPORT_CREATED в outbox.
  GET /v1/damage-reports/{reportId} → 200 с полными данными.
  Несколько damage reports для одной аренды — разрешено.

business_goals:
  - "Damage report создаётся только для завершённой аренды"
  - "Все поля повреждения сохраняются: тип, описание, фото"
  - "Серьёзность повреждения (severity) фиксируется для последующего анализа"
  - "Каждый damage report фиксируется в outbox"
  - "Нельзя создать отчёт для активной аренды"

preconditions:
  setup_call: "POST /mock/reset"
  seed_state:
    rental_finished:
      id: "rental-finished"
      status: FINISHED
      userId: "user-for-fine"
      vehicleId: "vehicle-available-5"
      amount: 480.0
      note: "Используется для cases 013 и 014"
    rental_started:
      id: "rental-started"
      status: STARTED
      userId: "user-with-rental"
      vehicleId: "vehicle-in-use"
      note: "Для теста RENTAL_NOT_CLOSED"

api_chain:
  - step: 1
    name: "Проверить rental-finished имеет статус FINISHED"
    method: GET
    path: /v1/rentals/rental-finished
    expected_status: 200
    assert:
      - "response.status == 'FINISHED'"
      - "response.userId == 'user-for-fine'"
      - "response.vehicleId == 'vehicle-available-5'"

  - step: 2
    name: "Создать damage report — царапина (LOW severity)"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-finished"
      vehicleId: "vehicle-available-5"
      description: "Царапина на левом крыле длиной ~10 см"
      severity: "LOW"
      photoUrls: ["https://cdn.example.com/photos/scratch-1.jpg"]
    expected_status: 201
    assert:
      - "response.reportId не пустой"
      - "response.rentalId == 'rental-finished'"
      - "response.vehicleId == 'vehicle-available-5'"
      - "response.userId == 'user-for-fine'"
      - "response.description == 'Царапина на левом крыле длиной ~10 см'"
      - "response.severity == 'LOW'"
      - "response.status == 'CREATED'"
      - "response.created_at не пустой"
    extract: {reportId1: "response.reportId"}

  - step: 3
    name: "GET damage report по reportId"
    method: GET
    path: "/v1/damage-reports/{reportId1}"
    expected_status: 200
    assert:
      - "response.reportId == {reportId1}"
      - "response.rentalId == 'rental-finished'"
      - "response.severity == 'LOW'"
      - "response.status == 'CREATED'"

  - step: 4
    name: "Создать второй damage report — вмятина (HIGH severity)"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-finished"
      vehicleId: "vehicle-available-5"
      description: "Вмятина на бампере диаметром 5 см"
      severity: "HIGH"
      photoUrls:
        - "https://cdn.example.com/photos/dent-front.jpg"
        - "https://cdn.example.com/photos/dent-side.jpg"
    expected_status: 201
    assert:
      - "response.reportId != {reportId1}"
      - "response.severity == 'HIGH'"
      - "response.photoUrls имеет 2 элемента"
    extract: {reportId2: "response.reportId"}

  - step: 5
    name: "Создать третий damage report — без severity (дефолт MEDIUM)"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-finished"
      vehicleId: "vehicle-available-5"
      description: "Разбитое боковое зеркало"
    expected_status: 201
    assert:
      - "response.severity == 'MEDIUM'"
      - "response.photoUrls == []"

  - step: 6
    name: "Попытка damage report для активной аренды → 409 RENTAL_NOT_CLOSED"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-started"
      vehicleId: "vehicle-in-use"
      description: "Описание повреждения"
    expected_status: 409
    assert:
      - "response.error == 'RENTAL_NOT_CLOSED'"

  - step: 7
    name: "Damage report без rentalId → 422"
    method: POST
    path: /v1/damage-reports
    request_body:
      vehicleId: "vehicle-available-5"
      description: "Описание"
    expected_status: 422
    assert:
      - "response.error == 'DAMAGE_RENTAL_REQUIRED'"

  - step: 8
    name: "Damage report без vehicleId → 422"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-finished"
      description: "Описание"
    expected_status: 422
    assert:
      - "response.error == 'DAMAGE_VEHICLE_REQUIRED'"

  - step: 9
    name: "Damage report без description → 422"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-finished"
      vehicleId: "vehicle-available-5"
    expected_status: 422
    assert:
      - "response.error == 'DAMAGE_DESCRIPTION_REQUIRED'"

  - step: 10
    name: "Damage report с невалидным severity → 422"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-finished"
      vehicleId: "vehicle-available-5"
      description: "Описание повреждения"
      severity: "EXTREME"
    expected_status: 422
    assert:
      - "response.error == 'DAMAGE_SEVERITY_INVALID'"

  - step: 11
    name: "Damage report для несуществующей аренды → 404"
    method: POST
    path: /v1/damage-reports
    request_body:
      rentalId: "rental-nonexistent"
      vehicleId: "vehicle-available-5"
      description: "Описание"
    expected_status: 404
    assert:
      - "response.error == 'RENTAL_NOT_FOUND'"

  - step: 12
    name: "Outbox содержит 3 события DAMAGE_REPORT_CREATED"
    method: GET
    path: "/mock/outbox?type=DAMAGE_REPORT_CREATED"
    expected_status: 200
    assert:
      - "count == 3"

  - step: 13
    name: "GET несуществующего damage report → 404"
    method: GET
    path: "/v1/damage-reports/dmg-nonexistent"
    expected_status: 404
    assert:
      - "response.error == 'DAMAGE_REPORT_NOT_FOUND'"

# ─── ФЛК-правила ─────────────────────────────────────────────────────
flk_rules:
  - id: FLK-DAMAGE-RENTAL-REQUIRED
    endpoint: POST /v1/damage-reports
    condition: "rentalId отсутствует в теле запроса"
    test_input: {vehicleId: "vehicle-available-5", description: "Описание"}
    expected_status: 422
    expected_error_code: DAMAGE_RENTAL_REQUIRED

  - id: FLK-DAMAGE-VEHICLE-REQUIRED
    endpoint: POST /v1/damage-reports
    condition: "vehicleId отсутствует в теле запроса"
    test_input: {rentalId: "rental-finished", description: "Описание"}
    expected_status: 422
    expected_error_code: DAMAGE_VEHICLE_REQUIRED

  - id: FLK-DAMAGE-DESCRIPTION-REQUIRED
    endpoint: POST /v1/damage-reports
    condition: "description отсутствует в теле запроса"
    test_input: {rentalId: "rental-finished", vehicleId: "vehicle-available-5"}
    expected_status: 422
    expected_error_code: DAMAGE_DESCRIPTION_REQUIRED

  - id: FLK-DAMAGE-SEVERITY-INVALID
    endpoint: POST /v1/damage-reports
    condition: "severity не входит в допустимый набор: LOW, MEDIUM, HIGH, CRITICAL"
    test_input: {rentalId: "rental-finished", vehicleId: "vehicle-available-5", description: "Описание", severity: "EXTREME"}
    expected_status: 422
    expected_error_code: DAMAGE_SEVERITY_INVALID

  - id: FLK-RENTAL-NOT-CLOSED-DAMAGE
    endpoint: POST /v1/damage-reports
    condition: "rental.status == STARTED (аренда ещё не завершена)"
    test_seed: "rental-started"
    test_input: {rentalId: "rental-started", vehicleId: "vehicle-in-use", description: "Описание"}
    expected_status: 409
    expected_error_code: RENTAL_NOT_CLOSED

  - id: FLK-RENTAL-NOT-FOUND-DAMAGE
    endpoint: POST /v1/damage-reports
    condition: "rentalId не существует в системе"
    test_input: {rentalId: "rental-nonexistent", vehicleId: "vehicle-available-5", description: "Описание"}
    expected_status: 404
    expected_error_code: RENTAL_NOT_FOUND

  - id: FLK-DAMAGE-REPORT-NOT-FOUND
    endpoint: GET /v1/damage-reports/{reportId}
    condition: "reportId не существует"
    test_input: "dmg-nonexistent"
    expected_status: 404
    expected_error_code: DAMAGE_REPORT_NOT_FOUND

expected_outbox_events:
  on_success:
    - {event_type: DAMAGE_REPORT_CREATED, fields: [reportId, rentalId, vehicleId, severity]}
  note: "Один DAMAGE_REPORT_CREATED на каждый успешно созданный отчёт"
  must_not_appear_on_error:
    - "DAMAGE_REPORT_CREATED не должен публиковаться при ошибках валидации"

# ─── Граничные значения ─────────────────────────────────────────────────
boundary_value_analysis:
  - field: "severity"
    cases:
      - {value: "LOW", expected: "201 CREATED — минимальная серьёзность"}
      - {value: "MEDIUM", expected: "201 CREATED (дефолтное значение)"}
      - {value: "HIGH", expected: "201 CREATED"}
      - {value: "CRITICAL", expected: "201 CREATED — максимальная серьёзность"}
      - {value: "EXTREME", expected: "422 DAMAGE_SEVERITY_INVALID"}
      - {value: "", expected: "422 DAMAGE_SEVERITY_INVALID (пустая строка)"}
      - {value: null, expected: "201 CREATED (null → используется дефолт MEDIUM)"}

  - field: "description"
    cases:
      - {value: "", expected: "422 DAMAGE_DESCRIPTION_REQUIRED (пустая строка)"}
      - {value: "X", expected: "201 CREATED (минимальное описание)"}
      - {value: "<очень длинная строка>", expected: "201 CREATED (нет ограничения длины в mock)"}

  - field: "rental status для damage report"
    allowed: [FINISHED, PAID, PAYMENT_FAILED]
    denied: [STARTED, CREATED]
    note: "RENTAL_NOT_CLOSED при статусе не из допустимого набора"

  - field: "photoUrls"
    cases:
      - {value: [], expected: "201 CREATED (пустой массив — допустимо)"}
      - {value: null, expected: "201 CREATED (нет поля — дефолт [])"}
      - {value: ["url1", "url2"], expected: "201 CREATED (несколько URL)"}

# ─── Техники тест-дизайна ─────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    valid_class:
      - "rental.status in {FINISHED, PAID, PAYMENT_FAILED} + rentalId + vehicleId + description → 201"
    invalid_classes:
      - "rental.status == STARTED → 409 RENTAL_NOT_CLOSED"
      - "rentalId отсутствует → 422 DAMAGE_RENTAL_REQUIRED"
      - "vehicleId отсутствует → 422 DAMAGE_VEHICLE_REQUIRED"
      - "description отсутствует → 422 DAMAGE_DESCRIPTION_REQUIRED"
      - "severity не в {LOW,MEDIUM,HIGH,CRITICAL} → 422 DAMAGE_SEVERITY_INVALID"
      - "rentalId не существует → 404 RENTAL_NOT_FOUND"
      - "reportId не существует → 404 DAMAGE_REPORT_NOT_FOUND"

  boundary_value_analysis:
    severity_enum: "4 допустимых значения + невалидное"
    description: "пустая → 422, минимальная ('X') → 201"

  pairwise_testing:
    description: "Тип повреждения × severity"
    pairs:
      - {description: "Царапина", severity: "LOW", expected: "201"}
      - {description: "Вмятина", severity: "HIGH", expected: "201"}
      - {description: "Разбитое стекло", severity: "CRITICAL", expected: "201"}
      - {description: "Загрязнение салона", severity: "MEDIUM", expected: "201"}

  multiple_reports:
    description: "Несколько damage reports для одной аренды"
    test: "3 отчёта для rental-finished → все 3 создаются → 3 DAMAGE_REPORT_CREATED в outbox"

  decision_table:
    title: "Создание damage report — условия"
    conditions:
      C1_rental_exists: [true, false]
      C2_rental_closed: [true, false]
      C3_required_fields: [true, false]
      C4_severity_valid: [true, false]
    outcomes:
      - "true + true + true + true → 201 CREATED"
      - "false + N/A + N/A + N/A → 404 RENTAL_NOT_FOUND"
      - "true + false + N/A + N/A → 409 RENTAL_NOT_CLOSED"
      - "true + true + false + N/A → 422 (DAMAGE_*_REQUIRED)"
      - "true + true + true + false → 422 DAMAGE_SEVERITY_INVALID"

coverage_checklist:
  positive:
    - "[ ] Создание damage report для FINISHED аренды с severity LOW → 201"
    - "[ ] Создание damage report с severity HIGH и несколькими photoUrls → 201"
    - "[ ] Создание damage report без severity (дефолт MEDIUM) → 201"
    - "[ ] GET damage report по reportId → 200"
    - "[ ] Несколько damage reports для одной аренды (3 штуки)"
    - "[ ] Damage report для PAID аренды → 201"
    - "[ ] DAMAGE_REPORT_CREATED в outbox"
  negative:
    - "[ ] RENTAL_NOT_CLOSED (STARTED rental)"
    - "[ ] DAMAGE_RENTAL_REQUIRED (нет rentalId)"
    - "[ ] DAMAGE_VEHICLE_REQUIRED (нет vehicleId)"
    - "[ ] DAMAGE_DESCRIPTION_REQUIRED (нет description)"
    - "[ ] DAMAGE_SEVERITY_INVALID (невалидный severity)"
    - "[ ] RENTAL_NOT_FOUND (несуществующий rentalId)"
    - "[ ] DAMAGE_REPORT_NOT_FOUND (GET несуществующего reportId)"
  boundary:
    - "[ ] severity = 'LOW' → 201"
    - "[ ] severity = 'CRITICAL' → 201"
    - "[ ] severity = 'EXTREME' → 422"
    - "[ ] description = '' → 422"
    - "[ ] photoUrls = [] → 201"
  outbox:
    - "[ ] DAMAGE_REPORT_CREATED содержит reportId, rentalId, vehicleId, severity"
    - "[ ] При 422/409 DAMAGE_REPORT_CREATED НЕ публикуется"
    - "[ ] 3 damage reports → 3 события в outbox"
