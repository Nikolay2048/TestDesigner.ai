# ═══════════════════════════════════════════════════════════════════════
# KB-002 — Истечение бронирования до старта аренды
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-002
title: "Попытка старта аренды по истёкшему бронированию"
type: negative
category: booking_expiry
chain_id: NEG-002

source_files:
  business_requirements: "data/cases/case_002_booking_expired_before_rental_start/01_business_requirements.md"
  system_analysis: "data/cases/case_002_booking_expired_before_rental_start/02_system_analysis.md"
  openapi: "data/cases/case_002_booking_expired_before_rental_start/03_openapi.yaml"
  flk_rules: "data/cases/case_002_booking_expired_before_rental_start/04_flk_rules.yaml"
  status_matrix: "data/cases/case_002_booking_expired_before_rental_start/05_status_transition_matrix.yaml"

summary: >
  Система должна отклонять запуск аренды по бронированию с истёкшим TTL.
  Два подварианта: (A) booking уже в статусе EXPIRED — ошибка BOOKING_STATUS_INVALID;
  (B) booking в статусе CONFIRMED но expires_at в прошлом — ошибка BOOKING_EXPIRED.
  После любого отказа авто не должно переходить в IN_USE, rental session не создаётся,
  RENTAL_STARTED не публикуется в outbox.

business_goals:
  - "Нельзя начать аренду по просроченному бронированию — любой вариант"
  - "Авто остаётся доступным после истечения бронирования"
  - "Новое бронирование на то же авто должно быть возможным после освобождения"

preconditions:
  setup_call: "POST /mock/reset"
  seed_state:
    booking_expired:
      id: "booking-expired"
      status: EXPIRED
      userId: "user-verified"
      vehicleId: "vehicle-available-4"
      expires_at: "в прошлом (-15 min)"
    booking_to_expire:
      id: "booking-to-expire"
      status: CONFIRMED
      userId: "user-auto-cancel"
      vehicleId: "vehicle-available-3"
      expires_at: "в прошлом (-5 min)"
      note: "статус CONFIRMED, но TTL истёк — тригерит BOOKING_EXPIRED"
    vehicle_available_4: {status: AVAILABLE}
    vehicle_available_3: {status: RESERVED}

# ─── Цепочка проверок ─────────────────────────────────────────────────
api_chain:
  - step: 1
    name: "Получить состояние истёкшего бронирования (уже EXPIRED)"
    method: GET
    path: /v1/bookings/booking-expired
    expected_status: 200
    assert:
      - "response.status == 'EXPIRED'"
      - "response.expires_at — в прошлом"

  - step: 2
    name: "Попытка старта по EXPIRED бронированию → 409 BOOKING_STATUS_INVALID"
    method: POST
    path: /v1/rentals/start
    request_body: {bookingId: "booking-expired"}
    expected_status: 409
    assert:
      - "response.error == 'BOOKING_STATUS_INVALID'"
      - "response.message содержит описание"

  - step: 3
    name: "Авто vehicle-available-4 осталось AVAILABLE"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'AVAILABLE'"

  - step: 4
    name: "Rental session НЕ создалась"
    method: GET
    path: /mock/outbox
    expected_status: 200
    assert:
      - "outbox НЕ содержит события RENTAL_STARTED"

  - step: 5
    name: "Получить бронирование с истёкшим TTL (CONFIRMED, но прошлое expires_at)"
    method: GET
    path: /v1/bookings/booking-to-expire
    expected_status: 200
    assert:
      - "response.status == 'CONFIRMED'"
      - "response.expires_at — в прошлом"

  - step: 6
    name: "Попытка старта по CONFIRMED с истёкшим TTL → 409 BOOKING_EXPIRED"
    method: POST
    path: /v1/rentals/start
    request_body: {bookingId: "booking-to-expire"}
    expected_status: 409
    assert:
      - "response.error == 'BOOKING_EXPIRED'"

  - step: 7
    name: "Авто vehicle-available-3 осталось RESERVED (booking-to-expire не expire-нулся авто)"
    method: GET
    path: /v1/vehicles/vehicle-available-3
    expected_status: 200
    assert:
      - "response.status == 'RESERVED'"
      - "note: авто остаётся RESERVED пока не сработает планировщик expire"

  - step: 8
    name: "Выполнить системное expire бронирования (шаг планировщика)"
    method: POST
    path: /v1/bookings/booking-to-expire/expire
    expected_status: 200
    assert:
      - "response.status == 'EXPIRED'"

  - step: 9
    name: "Авто vehicle-available-3 теперь AVAILABLE"
    method: GET
    path: /v1/vehicles/vehicle-available-3
    expected_status: 200
    assert:
      - "response.status == 'AVAILABLE'"

  - step: 10
    name: "Создание нового бронирования на освободившееся авто (контрастный позитивный тест)"
    method: POST
    path: /v1/bookings
    request_body: {userId: "user-verified", vehicleId: "vehicle-available-3"}
    expected_status: 201
    assert:
      - "response.status == 'CONFIRMED'"

  - step: 11
    name: "Старт аренды по новому бронированию (контраст)"
    method: POST
    path: /v1/rentals/start
    request_body: {bookingId: "{bookingId из шага 10}"}
    expected_status: 201
    assert:
      - "response.status == 'STARTED'"

# ─── ФЛК-правила ─────────────────────────────────────────────────────
flk_rules:
  - id: FLK-BOOKING-STATUS-INVALID
    endpoint: POST /v1/rentals/start
    condition: "booking.status == EXPIRED"
    test_seed_id: "booking-expired"
    expected_status: 409
    expected_error_code: BOOKING_STATUS_INVALID
    postconditions:
      - "rental session не создана"
      - "vehicle статус не изменился"
      - "RENTAL_STARTED не в outbox"

  - id: FLK-BOOKING-EXPIRED-TTL
    endpoint: POST /v1/rentals/start
    condition: "booking.status == CONFIRMED, expires_at < now()"
    test_seed_id: "booking-to-expire"
    expected_status: 409
    expected_error_code: BOOKING_EXPIRED
    postconditions:
      - "rental session не создана"
      - "RENTAL_STARTED не в outbox"

  - id: FLK-BOOKING-CANCELLED
    endpoint: POST /v1/rentals/start
    condition: "booking.status == CANCELLED"
    setup: ["POST /mock/reset", "POST /v1/bookings {userId: 'user-verified', vehicleId: 'vehicle-available-4'}", "POST /v1/bookings/{id}/cancel"]
    expected_status: 409
    expected_error_code: BOOKING_STATUS_INVALID

  - id: FLK-BOOKING-NOT-FOUND
    endpoint: POST /v1/rentals/start
    condition: "bookingId не существует"
    test_input: {bookingId: "booking-nonexistent"}
    expected_status: 404
    expected_error_code: BOOKING_NOT_FOUND

# ─── Переходы статусов ─────────────────────────────────────────────────
status_transitions:
  - entity: booking
    transitions:
      - {from: CONFIRMED, to: EXPIRED, trigger: "POST /v1/bookings/{id}/expire → 200"}
    forbidden:
      - {from: EXPIRED, to: STARTED, reason: "Истёкшее бронирование нельзя использовать для старта аренды"}
      - {from: CANCELLED, to: STARTED, reason: "Отменённое бронирование нельзя использовать для старта аренды"}
  - entity: vehicle
    transitions:
      - {from: RESERVED, to: AVAILABLE, trigger: "POST /v1/bookings/{id}/expire → 200 (авто освобождается)"}
    note: "При попытке старта по истёкшему booking авто НЕ меняет статус"

expected_outbox_events:
  on_success:
    - {event_type: BOOKING_EXPIRED, trigger: "POST /v1/bookings/{id}/expire → 200"}
  must_not_appear_on_rejection:
    - "RENTAL_STARTED"

# ─── Граничные значения ─────────────────────────────────────────────────
boundary_value_analysis:
  - field: "booking expires_at"
    cases:
      - {value: "expires_at = now() + 1 sec", expected: "201 STARTED (валидное)"}
      - {value: "expires_at = now()", expected: "409 BOOKING_EXPIRED"}
      - {value: "expires_at = now() - 1 sec", expected: "409 BOOKING_EXPIRED"}
    note: "Условие: expires_at <= now() → EXPIRED. Граничное значение: точное совпадение с now()."
    seed_boundary: "booking-to-expire — expires_at = now() - 5 min"

# ─── Техники тест-дизайна ─────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    valid_class:
      - "booking.status=CONFIRMED + expires_at > now() → 201 STARTED"
    invalid_classes:
      - "booking.status=EXPIRED → 409 BOOKING_STATUS_INVALID"
      - "booking.status=CANCELLED → 409 BOOKING_STATUS_INVALID"
      - "booking.status=CONFIRMED + expires_at < now() → 409 BOOKING_EXPIRED"
      - "bookingId не существует → 404 BOOKING_NOT_FOUND"

  state_transition:
    booking_states_before_start: [CONFIRMED_valid, CONFIRMED_expired_ttl, EXPIRED, CANCELLED, NOT_FOUND]
    expected_results:           [201_STARTED,        409_BOOKING_EXPIRED,   409_STATUS_INVALID, 409_STATUS_INVALID, 404]

coverage_checklist:
  negative:
    - "[ ] Старт по EXPIRED бронированию → 409 BOOKING_STATUS_INVALID"
    - "[ ] Старт по CONFIRMED с истёкшим TTL → 409 BOOKING_EXPIRED"
    - "[ ] Старт по CANCELLED бронированию → 409 BOOKING_STATUS_INVALID"
    - "[ ] Старт по несуществующему bookingId → 404 BOOKING_NOT_FOUND"
  state_integrity:
    - "[ ] Авто статус не меняется при любом отказе"
    - "[ ] Rental session не создаётся при отказе"
    - "[ ] RENTAL_STARTED не появляется в outbox"
  positive:
    - "[ ] После expire-а авто возвращается в AVAILABLE"
    - "[ ] На освободившееся авто можно создать новое бронирование"
    - "[ ] BOOKING_EXPIRED попадает в outbox"
  boundary:
    - "[ ] expires_at = now() → BOOKING_EXPIRED"
