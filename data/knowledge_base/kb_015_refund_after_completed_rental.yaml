# ═══════════════════════════════════════════════════════════════════════
# KB-015 — Возврат платежа после завершённой аренды
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-015
title: "Возврат (refund) платежа: полный и частичный"
type: positive
category: refund
chain_id: POS-015

source_files:
  business_requirements: "data/cases/case_015_refund_after_completed_rental/01_business_requirements.md"
  system_analysis: "data/cases/case_015_refund_after_completed_rental/02_system_analysis.md"
  openapi: "data/cases/case_015_refund_after_completed_rental/03_openapi.yaml"
  flk_rules: "data/cases/case_015_refund_after_completed_rental/04_flk_rules.yaml"
  status_matrix: "data/cases/case_015_refund_after_completed_rental/05_status_transition_matrix.yaml"

summary: >
  Возврат создаётся для платежей в статусах CAPTURED, PAID или PARTIALLY_REFUNDED.
  Полный возврат (amount == payment.amount): payment.status → REFUNDED.
  Частичный возврат (amount < payment.amount): payment.status → PARTIALLY_REFUNDED.
  Повторный возврат полностью возвращённого платежа → 409 PAYMENT_ALREADY_REFUNDED.
  Сумма возврата > суммы платежа → 422 REFUND_AMOUNT_TOO_HIGH.
  Сумма возврата ≤ 0 → 422 REFUND_AMOUNT_INVALID.
  Платёж не найден → 404 PAYMENT_NOT_FOUND.
  Платёж в статусе FAILED → 409 PAYMENT_NOT_CAPTURABLE.
  После создания: PAYMENT_REFUNDED в outbox.
  Поле reason опциональное (дефолт CUSTOMER_REQUEST).

business_goals:
  - "Клиент может получить возврат за оплаченную аренду"
  - "Частичный возврат (например, компенсация за технический сбой)"
  - "Полностью возвращённый платёж не может быть повторно возвращён"
  - "Сумма возврата не может превышать сумму исходного платежа"
  - "Причина возврата фиксируется для последующего аудита"

preconditions:
  setup_call: "POST /mock/reset"
  seed_state:
    payment_captured:
      id: "payment-captured"
      status: CAPTURED
      rentalId: "rental-for-refund"
      userId: "user-for-refund"
      amount: 240.0
      currency: "RUB"
    rental_for_refund:
      id: "rental-for-refund"
      status: PAID
      userId: "user-for-refund"
      vehicleId: "vehicle-available-5"
      amount: 240.0
      note: "Платёж уже произведён и захвачен"

api_chain:
  - step: 1
    name: "Проверить платёж payment-captured — статус CAPTURED"
    method: GET
    path: /v1/payments/payment-captured
    expected_status: 200
    assert:
      - "response.status == 'CAPTURED'"
      - "response.amount == 240.0"
      - "response.rentalId == 'rental-for-refund'"
      - "response.userId == 'user-for-refund'"

  - step: 2
    name: "Проверить аренду rental-for-refund — статус PAID"
    method: GET
    path: /v1/rentals/rental-for-refund
    expected_status: 200
    assert:
      - "response.status == 'PAID'"

  - step: 3
    name: "Частичный возврат — 100 RUB из 240 RUB"
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body:
      amount: 100.0
      reason: "SERVICE_ISSUE"
    expected_status: 201
    assert:
      - "response.refundId не пустой"
      - "response.paymentId == 'payment-captured'"
      - "response.rentalId == 'rental-for-refund'"
      - "response.amount == 100.0"
      - "response.reason == 'SERVICE_ISSUE'"
      - "response.status == 'COMPLETED'"
      - "response.created_at не пустой"
    extract: {refundId1: "response.refundId"}

  - step: 4
    name: "GET платежа — статус изменился на PARTIALLY_REFUNDED"
    method: GET
    path: /v1/payments/payment-captured
    expected_status: 200
    assert:
      - "response.status == 'PARTIALLY_REFUNDED'"
      - "response.refund_amount == 100.0"
      - "response.refunded_at не пустой"

  - step: 5
    name: "Второй возврат остатка — 140 RUB (полное закрытие)"
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body:
      amount: 140.0
      reason: "CUSTOMER_REQUEST"
    expected_status: 201
    assert:
      - "response.refundId != {refundId1}"
      - "response.amount == 140.0"
      - "response.status == 'COMPLETED'"

  - step: 6
    name: "GET платежа — статус изменился на REFUNDED"
    method: GET
    path: /v1/payments/payment-captured
    expected_status: 200
    assert:
      - "response.status == 'REFUNDED'"

  - step: 7
    name: "Повторный возврат для REFUNDED платежа → 409 PAYMENT_ALREADY_REFUNDED"
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body: {amount: 10.0}
    expected_status: 409
    assert:
      - "response.error == 'PAYMENT_ALREADY_REFUNDED'"

  - step: "7a — Сброс и тест полного возврата за один запрос"
    note: >
      Для тестирования полного возврата в одном запросе:
      1. POST /mock/reset
      2. POST /v1/payments/payment-captured/refund {amount: 240.0} → 201
      3. GET /v1/payments/payment-captured → status == 'REFUNDED'

  - step: 8
    name: "Возврат суммы > суммы платежа → 422 REFUND_AMOUNT_TOO_HIGH"
    setup: ["POST /mock/reset"]
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body: {amount: 241.0}
    expected_status: 422
    assert:
      - "response.error == 'REFUND_AMOUNT_TOO_HIGH'"

  - step: 9
    name: "Возврат с amount=0 → 422 REFUND_AMOUNT_INVALID"
    setup: ["POST /mock/reset"]
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body: {amount: 0}
    expected_status: 422
    assert:
      - "response.error == 'REFUND_AMOUNT_INVALID'"

  - step: 10
    name: "Возврат с amount=-1 → 422 REFUND_AMOUNT_INVALID"
    setup: ["POST /mock/reset"]
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body: {amount: -1}
    expected_status: 422
    assert:
      - "response.error == 'REFUND_AMOUNT_INVALID'"

  - step: 11
    name: "Возврат для несуществующего платежа → 404 PAYMENT_NOT_FOUND"
    method: POST
    path: /v1/payments/payment-nonexistent/refund
    request_body: {amount: 50.0}
    expected_status: 404
    assert:
      - "response.error == 'PAYMENT_NOT_FOUND'"

  - step: 12
    name: "Возврат для FAILED платежа → 409 PAYMENT_NOT_CAPTURABLE"
    note: "Seed payment-failed имеет статус FAILED (rental-for-retry, 360 RUB)"
    method: POST
    path: /v1/payments/payment-failed/refund
    request_body: {amount: 100.0}
    expected_status: 409
    assert:
      - "response.error == 'PAYMENT_NOT_CAPTURABLE'"

  - step: 13
    name: "Возврат без body — дефолтный amount (вся сумма) и reason CUSTOMER_REQUEST"
    setup: ["POST /mock/reset"]
    method: POST
    path: /v1/payments/payment-captured/refund
    request_body: {}
    expected_status: 201
    assert:
      - "response.amount == 240.0"
      - "response.reason == 'CUSTOMER_REQUEST'"

  - step: 14
    name: "Outbox содержит PAYMENT_REFUNDED"
    method: GET
    path: "/mock/outbox?type=PAYMENT_REFUNDED"
    expected_status: 200
    assert:
      - "count >= 1"

# ─── ФЛК-правила ─────────────────────────────────────────────────────
flk_rules:
  - id: FLK-PAYMENT-NOT-FOUND
    endpoint: POST /v1/payments/{paymentId}/refund
    condition: "paymentId не существует"
    test_input: "payment-nonexistent"
    expected_status: 404
    expected_error_code: PAYMENT_NOT_FOUND

  - id: FLK-PAYMENT-ALREADY-REFUNDED
    endpoint: POST /v1/payments/{paymentId}/refund
    condition: "payment.status == REFUNDED (полный возврат уже был)"
    test_seed: "payment-captured (после полного возврата)"
    expected_status: 409
    expected_error_code: PAYMENT_ALREADY_REFUNDED

  - id: FLK-PAYMENT-NOT-CAPTURABLE
    endpoint: POST /v1/payments/{paymentId}/refund
    condition: "payment.status == FAILED (или другой некэшируемый статус)"
    test_seed: "payment-failed"
    test_input: {amount: 100.0}
    expected_status: 409
    expected_error_code: PAYMENT_NOT_CAPTURABLE

  - id: FLK-REFUND-AMOUNT-INVALID
    endpoint: POST /v1/payments/{paymentId}/refund
    condition: "amount <= 0"
    test_input: {amount: 0}
    expected_status: 422
    expected_error_code: REFUND_AMOUNT_INVALID

  - id: FLK-REFUND-AMOUNT-TOO-HIGH
    endpoint: POST /v1/payments/{paymentId}/refund
    condition: "amount > payment.amount (240.0)"
    test_input: {amount: 241.0}
    test_seed: "payment-captured"
    expected_status: 422
    expected_error_code: REFUND_AMOUNT_TOO_HIGH

# ─── Переходы статусов ─────────────────────────────────────────────────
status_transitions:
  - entity: payment
    transitions:
      - {from: CAPTURED, to: PARTIALLY_REFUNDED, trigger: "POST /refund с amount < payment.amount"}
      - {from: CAPTURED, to: REFUNDED, trigger: "POST /refund с amount == payment.amount"}
      - {from: PARTIALLY_REFUNDED, to: REFUNDED, trigger: "POST /refund (суммарно = full amount)"}
      - {from: PAID, to: PARTIALLY_REFUNDED, trigger: "POST /refund частичный"}
      - {from: PAID, to: REFUNDED, trigger: "POST /refund полный"}
    forbidden:
      - {from: REFUNDED, to: REFUNDED, reason: "PAYMENT_ALREADY_REFUNDED → 409"}
      - {from: FAILED, to: REFUNDED, reason: "PAYMENT_NOT_CAPTURABLE → 409"}
    refundable_statuses: [CAPTURED, PAID, PARTIALLY_REFUNDED]
    non_refundable_statuses: [FAILED, REFUNDED, NEW, AUTHORIZED, RETRYING]

expected_outbox_events:
  on_success:
    - {event_type: PAYMENT_REFUNDED, fields: [paymentId, refundId, amount]}
  note: "Один PAYMENT_REFUNDED на каждый успешный вызов /refund"
  must_not_appear_on_error:
    - "PAYMENT_REFUNDED не должен публиковаться при ошибках валидации"

# ─── Граничные значения ─────────────────────────────────────────────────
boundary_value_analysis:
  - field: "refund amount"
    payment_amount: 240.0
    cases:
      - {value: 0, expected: "422 REFUND_AMOUNT_INVALID"}
      - {value: -1, expected: "422 REFUND_AMOUNT_INVALID (отрицательное)"}
      - {value: 0.01, expected: "201 PARTIALLY_REFUNDED (минимальный возврат)"}
      - {value: 100.0, expected: "201 PARTIALLY_REFUNDED"}
      - {value: 239.99, expected: "201 PARTIALLY_REFUNDED"}
      - {value: 240.0, expected: "201 REFUNDED (полный возврат = сумма платежа)"}
      - {value: 240.01, expected: "422 REFUND_AMOUNT_TOO_HIGH (чуть выше суммы)"}
      - {value: 241.0, expected: "422 REFUND_AMOUNT_TOO_HIGH"}

  - field: "payment status для refund"
    allowed: [CAPTURED, PAID, PARTIALLY_REFUNDED]
    denied: [FAILED, REFUNDED, NEW, AUTHORIZED, RETRYING]

# ─── Техники тест-дизайна ─────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    valid_classes:
      - "payment.status in {CAPTURED, PAID, PARTIALLY_REFUNDED} + 0 < amount <= payment.amount → 201"
    invalid_classes:
      - "payment не существует → 404 PAYMENT_NOT_FOUND"
      - "payment.status == REFUNDED → 409 PAYMENT_ALREADY_REFUNDED"
      - "payment.status == FAILED → 409 PAYMENT_NOT_CAPTURABLE"
      - "amount <= 0 → 422 REFUND_AMOUNT_INVALID"
      - "amount > payment.amount → 422 REFUND_AMOUNT_TOO_HIGH"

  boundary_value_analysis:
    refund_amount_boundary:
      - "amount=0 → 422, amount=0.01 → 201 PARTIALLY_REFUNDED"
      - "amount=240.0 → 201 REFUNDED (точно равно сумме платежа)"
      - "amount=240.01 → 422 REFUND_AMOUNT_TOO_HIGH"

  state_transition:
    refund_flow:
      - "CAPTURED → частичный refund → PARTIALLY_REFUNDED"
      - "CAPTURED → полный refund → REFUNDED"
      - "PARTIALLY_REFUNDED → повторный refund → REFUNDED (если остаток)"
      - "REFUNDED → повторный refund → 409 PAYMENT_ALREADY_REFUNDED"
      - "FAILED → refund → 409 PAYMENT_NOT_CAPTURABLE"

  decision_table:
    title: "Условия обработки refund"
    conditions:
      C1_payment_exists: [true, false]
      C2_payment_refundable: [CAPTURED/PAID/PARTIAL, REFUNDED, FAILED/OTHER]
      C3_amount_valid: ["0 < amount <= total", "amount <= 0", "amount > total"]
    outcomes:
      - "true + CAPTURED/PAID/PARTIAL + (0,total] → 201 COMPLETED"
      - "false + N/A + N/A → 404 PAYMENT_NOT_FOUND"
      - "true + REFUNDED + N/A → 409 PAYMENT_ALREADY_REFUNDED"
      - "true + FAILED + N/A → 409 PAYMENT_NOT_CAPTURABLE"
      - "true + CAPTURED + <= 0 → 422 REFUND_AMOUNT_INVALID"
      - "true + CAPTURED + > total → 422 REFUND_AMOUNT_TOO_HIGH"

  multiple_refunds:
    description: "Серия частичных возвратов — итоговое состояние"
    scenario:
      - "Шаг 1: refund 100 RUB из 240 → PARTIALLY_REFUNDED, refund_amount=100"
      - "Шаг 2: refund 140 RUB (остаток) → REFUNDED"
      - "Шаг 3: refund 10 RUB → 409 PAYMENT_ALREADY_REFUNDED"

coverage_checklist:
  positive:
    - "[ ] Частичный возврат CAPTURED платежа → 201 PARTIALLY_REFUNDED"
    - "[ ] Полный возврат CAPTURED платежа (amount == 240.0) → 201 REFUNDED"
    - "[ ] Возврат без body (дефолт: полная сумма + reason CUSTOMER_REQUEST) → 201"
    - "[ ] GET платежа после частичного возврата — status PARTIALLY_REFUNDED"
    - "[ ] GET платежа после полного возврата — status REFUNDED"
    - "[ ] PAYMENT_REFUNDED в outbox"
    - "[ ] refund для PAID платежа → 201"
    - "[ ] Серия возвратов: два частичных → итоговый REFUNDED"
  negative:
    - "[ ] PAYMENT_ALREADY_REFUNDED (повторный возврат REFUNDED платежа)"
    - "[ ] PAYMENT_NOT_CAPTURABLE (FAILED платёж)"
    - "[ ] PAYMENT_NOT_FOUND (несуществующий paymentId)"
    - "[ ] REFUND_AMOUNT_INVALID (amount=0)"
    - "[ ] REFUND_AMOUNT_INVALID (amount=-1)"
    - "[ ] REFUND_AMOUNT_TOO_HIGH (amount > payment.amount)"
  boundary:
    - "[ ] amount=0 → 422"
    - "[ ] amount=0.01 → 201 PARTIALLY_REFUNDED"
    - "[ ] amount=240.0 → 201 REFUNDED (точно равно сумме)"
    - "[ ] amount=240.01 → 422 REFUND_AMOUNT_TOO_HIGH"
    - "[ ] amount=241.0 → 422 REFUND_AMOUNT_TOO_HIGH"
  outbox:
    - "[ ] PAYMENT_REFUNDED содержит paymentId, refundId, amount"
    - "[ ] При 422/409 PAYMENT_REFUNDED НЕ публикуется"
    - "[ ] Два возврата → два события PAYMENT_REFUNDED"
