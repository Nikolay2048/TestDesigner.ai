# ═══════════════════════════════════════════════════════════════════════
# KNOWLEDGE BASE — Системный обзор Carsharing Backend
# Агент должен прочитать этот файл ПЕРВЫМ перед работой с карточками KB-001..KB-015.
# Все данные получены из data/cases/ и исходного кода mock-сервера.
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-000
title: "Системный обзор — API, сущности, ФЛК, seed-данные, mock-управление"
type: reference

# ─── Источники документации ────────────────────────────────────────────
source_files:
  cases_root: "data/cases/"
  manifest: "data/cases/manifest.json"
  case_001_analysis: "data/cases/case_001_successful_rental_flow/02_system_analysis.md"
  flk_reference: "data/cases/case_001_successful_rental_flow/04_flk_rules.yaml"
  status_matrix: "data/cases/case_001_successful_rental_flow/05_status_transition_matrix.yaml"
  openapi: "data/cases/case_001_successful_rental_flow/03_openapi.yaml"

# ─── Базовый URL mock-сервера ────────────────────────────────────────────
mock_server:
  base_url: "http://127.0.0.1:8082"
  api_prefix: "/v1"
  health_check: "GET /health"
  seed_ids_reference: "GET /mock/seed-ids"

# ─── Полный список API-эндпоинтов ────────────────────────────────────────
api_endpoints:
  users:
    - method: GET
      path: /v1/users/{userId}
      description: "Получение данных пользователя"
      responses: {200: "User object", 404: "USER_NOT_FOUND"}
    - method: GET
      path: /v1/users/{userId}/driver-license
      description: "Получение водительского удостоверения пользователя"
      responses: {200: "DriverLicense object", 404: "USER_NOT_FOUND | DRIVER_LICENSE_NOT_FOUND"}

  vehicles:
    - method: GET
      path: /v1/vehicles/available
      description: "Список автомобилей со статусом AVAILABLE"
      responses: {200: "{items: [...], count: N}"}
    - method: GET
      path: /v1/vehicles/{vehicleId}
      description: "Данные конкретного автомобиля + available_for_booking flag"
      responses: {200: "Vehicle object", 404: "VEHICLE_NOT_FOUND"}
    - method: GET
      path: /v1/vehicles/{vehicleId}/telemetry
      description: "Телеметрия автомобиля (скорость, двигатель, двери, координаты)"
      responses: {200: "Telemetry object | {available: false, stale: true}", 404: "VEHICLE_NOT_FOUND", 503: "TELEMETRY_SERVICE_UNAVAILABLE"}
    - method: PUT
      path: /v1/vehicles/{vehicleId}/telemetry
      description: "Обновление телеметрии (для агента — симуляция состояния авто)"
      request_body: {lat: float, lon: float, speed_kmh: float, fuel_level: float, engine_on: bool, doors_closed: bool}
      responses: {200: "Updated telemetry", 404: "VEHICLE_NOT_FOUND"}

  bookings:
    - method: POST
      path: /v1/bookings
      description: "Создание бронирования. TTL = 15 минут."
      request_body: {userId: string, vehicleId: string}
      responses: {201: "Booking CONFIRMED", 404: "USER_NOT_FOUND | VEHICLE_NOT_FOUND", 409: "USER_BLOCKED | USER_NOT_VERIFIED | DRIVER_LICENSE_EXPIRED | VEHICLE_NOT_AVAILABLE | USER_HAS_ACTIVE_RENTAL"}
    - method: GET
      path: /v1/bookings/{bookingId}
      description: "Данные бронирования"
      responses: {200: "Booking object", 404: "BOOKING_NOT_FOUND"}
    - method: POST
      path: /v1/bookings/{bookingId}/cancel
      description: "Отмена бронирования пользователем. Авто возвращается в AVAILABLE."
      request_body: {reason: string}
      responses: {200: "Booking CANCELLED", 404: "BOOKING_NOT_FOUND", 409: "BOOKING_STATUS_INVALID"}
    - method: POST
      path: /v1/bookings/{bookingId}/expire
      description: "Системное истечение бронирования (планировщик). Авто возвращается в AVAILABLE."
      responses: {200: "Booking EXPIRED", 404: "BOOKING_NOT_FOUND", 409: "BOOKING_STATUS_INVALID"}

  rentals:
    - method: POST
      path: /v1/rentals/start
      description: "Старт аренды по активному бронированию. Проверяет geo-service."
      request_body: {bookingId: string, userLocation: {lat: float, lon: float}}
      responses: {201: "Rental STARTED", 404: "BOOKING_NOT_FOUND", 409: "BOOKING_STATUS_INVALID | BOOKING_EXPIRED | USER_HAS_ACTIVE_RENTAL | USER_BLOCKED", 503: "GEO_SERVICE_UNAVAILABLE"}
    - method: GET
      path: /v1/rentals/{rentalId}
      description: "Данные аренды + preliminary_amount если STARTED"
      responses: {200: "Rental object", 404: "RENTAL_NOT_FOUND"}
    - method: POST
      path: /v1/rentals/{rentalId}/finish
      description: "Завершение аренды. Проверяет зону, телеметрию (engine, doors, speed)."
      responses: {200: "Rental FINISHED + amount", 404: "RENTAL_NOT_FOUND", 409: "RENTAL_STATUS_INVALID | VEHICLE_OUTSIDE_ALLOWED_ZONE | ENGINE_NOT_OFF | DOORS_NOT_CLOSED | VEHICLE_MOVING | RENTAL_FINISH_BLOCKED"}

  payments:
    - method: POST
      path: /v1/payments
      description: "Создание платежа для завершённой аренды. Результат зависит от payment_provider_available."
      request_body: {rentalId: string, amount: float, currency: string}
      responses: {201: "Payment CAPTURED or FAILED", 404: "RENTAL_NOT_FOUND", 409: "RENTAL_NOT_FINISHED | PAYMENT_OPERATION_DUPLICATE", 422: "PAYMENT_AMOUNT_INVALID"}
    - method: GET
      path: /v1/payments/{paymentId}
      description: "Данные платежа"
      responses: {200: "Payment object", 404: "PAYMENT_NOT_FOUND"}
    - method: POST
      path: /v1/payments/{paymentId}/retry
      description: "Повторная попытка списания FAILED платежа. Лимит = 3 попытки."
      responses: {200: "Payment CAPTURED or FAILED", 404: "PAYMENT_NOT_FOUND", 409: "PAYMENT_NOT_FAILED | PAYMENT_RETRY_LIMIT_EXCEEDED"}
    - method: POST
      path: /v1/payments/{paymentId}/refund
      description: "Возврат CAPTURED платежа (полный или частичный)."
      request_body: {amount: float, reason: string}
      responses: {201: "Refund object", 404: "PAYMENT_NOT_FOUND", 409: "PAYMENT_ALREADY_REFUNDED | PAYMENT_NOT_CAPTURABLE", 422: "REFUND_AMOUNT_INVALID | REFUND_AMOUNT_TOO_HIGH"}

  fines:
    - method: POST
      path: /v1/fines
      description: "Создание штрафа для завершённой аренды."
      request_body: {rentalId: string, userId: string, amount: float, reason: string, currency: string}
      responses: {201: "Fine CREATED", 404: "RENTAL_NOT_FOUND | USER_NOT_FOUND", 409: "RENTAL_NOT_CLOSED", 422: "FINE_RENTAL_REQUIRED | FINE_USER_REQUIRED | FINE_AMOUNT_INVALID | FINE_REASON_REQUIRED"}
    - method: GET
      path: /v1/fines/{fineId}
      description: "Данные штрафа"
      responses: {200: "Fine object", 404: "FINE_NOT_FOUND"}

  damage_reports:
    - method: POST
      path: /v1/damage-reports
      description: "Создание отчёта о повреждении для завершённой аренды."
      request_body: {rentalId: string, vehicleId: string, description: string, severity: "LOW|MEDIUM|HIGH|CRITICAL", photoUrls: list}
      responses: {201: "DamageReport CREATED", 404: "RENTAL_NOT_FOUND", 409: "RENTAL_NOT_CLOSED", 422: "DAMAGE_RENTAL_REQUIRED | DAMAGE_VEHICLE_REQUIRED | DAMAGE_DESCRIPTION_REQUIRED | DAMAGE_SEVERITY_INVALID"}
    - method: GET
      path: /v1/damage-reports/{reportId}
      description: "Данные отчёта о повреждении"
      responses: {200: "DamageReport object", 404: "DAMAGE_REPORT_NOT_FOUND"}

# ─── Mock-управление (без /v1 префикса) ─────────────────────────────────
mock_controls:
  state_management:
    - endpoint: "POST /mock/reset"
      description: "Восстановить начальное состояние. ВСЕГДА вызывать перед новым сценарием."
    - endpoint: "POST /mock/reseed"
      description: "Полный пересев данных"
    - endpoint: "GET /mock/state"
      description: "Полное состояние БД. ?collection=users|vehicles|bookings|rental_sessions|payments|fines|damage_reports|vehicle_telemetry|outbox_events|audit_logs"
    - endpoint: "GET /mock/config"
      description: "Текущая конфигурация mock-поведения"
    - endpoint: "POST /mock/config"
      description: "Обновить конфигурацию. Поля: geo_service_available, payment_provider_available, telemetry_service_available, notification_service_available"

  zone_control:
    - endpoint: "POST /mock/vehicles/{vehicleId}/set-outside-zone"
      description: "Поместить авто за пределы разрешённой зоны завершения (case 006)"
    - endpoint: "POST /mock/vehicles/{vehicleId}/set-inside-zone"
      description: "Вернуть авто в разрешённую зону"

  payment_control:
    - endpoint: "POST /mock/payments/{paymentId}/set-fail-capture"
      description: "Принудительно провалить capture конкретного платежа"
    - endpoint: "POST /mock/payments/{paymentId}/set-success-capture"
      description: "Отменить принудительный провал"
    - endpoint: "POST /mock/services/payment/disable"
      description: "Выключить платёжного провайдера глобально (case 007)"
    - endpoint: "POST /mock/services/payment/enable"
      description: "Включить платёжного провайдера"

  telemetry_control:
    - endpoint: "POST /mock/telemetry/{vehicleId}/set-lost"
      description: "Симуляция потери сигнала телеметрии (case 011)"
    - endpoint: "POST /mock/telemetry/{vehicleId}/set-restored"
      description: "Восстановить сигнал телеметрии"
    - endpoint: "POST /mock/services/telemetry/disable"
      description: "Выключить сервис телеметрии (503)"
    - endpoint: "POST /mock/services/telemetry/enable"
      description: "Включить сервис телеметрии"

  service_toggles:
    - endpoint: "POST /mock/services/geo/disable"
      description: "Выключить geo-service (503 при старте аренды)"
    - endpoint: "POST /mock/services/geo/enable"
      description: "Включить geo-service"
    - endpoint: "POST /mock/services/notification/disable"
      description: "Выключить notification-service (не должен влиять на основной флоу)"
    - endpoint: "POST /mock/services/notification/enable"
      description: "Включить notification-service"

  rental_block:
    - endpoint: "POST /mock/rentals/{rentalId}/block-finish"
      description: "Установить технический блок завершения аренды → 409 RENTAL_FINISH_BLOCKED"
    - endpoint: "POST /mock/rentals/{rentalId}/unblock-finish"
      description: "Снять технический блок"

  inspection:
    - endpoint: "GET /mock/outbox?type={eventType}"
      description: "Получить события outbox. eventType: BOOKING_CREATED|BOOKING_CANCELLED|BOOKING_EXPIRED|RENTAL_STARTED|RENTAL_FINISHED|VEHICLE_RELEASED|PAYMENT_CAPTURED|PAYMENT_FAILED|PAYMENT_REFUNDED|FINE_CREATED|DAMAGE_REPORT_CREATED"
    - endpoint: "GET /mock/audit?entity_type={type}&entity_id={id}"
      description: "Аудит-журнал изменений. entity_type: booking|rental|vehicle|payment|fine|damage_report"
    - endpoint: "GET /mock/seed-ids"
      description: "Справочник всех предзаполненных ID с описанием"

# ─── Предзаполненные seed-данные ─────────────────────────────────────────
seed_data:
  users:
    user-verified:
      status: VERIFIED
      driver_license: "VERIFIED, expires +3 года"
      payment_method: "активный (VISA *1234)"
      note: "основной пользователь для позитивных сценариев (case 001, 005, 006, 007…)"
    user-expired-lic:
      status: VERIFIED
      driver_license: "VERIFIED, истёк вчера (expiration_date = today-1)"
      payment_method: "активный"
      note: "case 003 — просроченное ВУ"
    user-blocked:
      status: BLOCKED
      driver_license: "REJECTED"
      payment_method: "отсутствует"
      note: "case 004 — заблокированный пользователь"
    user-for-cancel:
      status: VERIFIED
      driver_license: "действующее"
      payment_method: "активный"
      booking: "booking-to-cancel (CONFIRMED)"
      note: "case 009 — отмена бронирования"
    user-auto-cancel:
      status: VERIFIED
      driver_license: "действующее"
      payment_method: "активный"
      booking: "booking-to-expire (CONFIRMED, TTL истёк)"
      note: "case 010 — авто-истечение"
    user-with-rental:
      status: VERIFIED
      driver_license: "действующее"
      payment_method: "активный"
      booking: "booking-started (STARTED)"
      rental: "rental-started (STARTED)"
      note: "case 011, 012 — активная аренда"
    user-for-refund:
      status: VERIFIED
      rental: "rental-for-refund (PAID)"
      payment: "payment-captured (CAPTURED, 240 RUB)"
      note: "case 015 — возврат платежа"
    user-for-fine:
      status: VERIFIED
      rental: "rental-finished (FINISHED)"
      note: "case 013, 014 — штраф и damage report"
    user-for-retry:
      status: VERIFIED
      rental: "rental-for-retry (PAYMENT_FAILED)"
      payment: "payment-failed (FAILED, retry_count=0)"
      note: "case 008 — повторная попытка оплаты"

  vehicles:
    vehicle-available-1: {status: RESERVED, booking: "booking-confirmed (user-verified)"}
    vehicle-available-2: {status: RESERVED, booking: "booking-to-cancel (user-for-cancel)"}
    vehicle-available-3: {status: RESERVED, booking: "booking-to-expire (user-auto-cancel)"}
    vehicle-available-4: {status: AVAILABLE, note: "свободное авто для динамических тестов"}
    vehicle-available-5: {status: AVAILABLE, note: "свободное авто для динамических тестов"}
    vehicle-reserved:    {status: RESERVED, booking: "booking-reserved (case 005)"}
    vehicle-in-use:      {status: IN_USE, rental: "rental-started (case 006,011,012)"}
    vehicle-maintenance: {status: MAINTENANCE}
    vehicle-blocked:     {status: BLOCKED}

  bookings:
    booking-confirmed:  {status: CONFIRMED, userId: user-verified, vehicleId: vehicle-available-1, expires: "+5 min"}
    booking-expired:    {status: EXPIRED, userId: user-verified, vehicleId: vehicle-available-4, expires: "прошлое"}
    booking-to-cancel:  {status: CONFIRMED, userId: user-for-cancel, vehicleId: vehicle-available-2, expires: "+10 min"}
    booking-to-expire:  {status: CONFIRMED, userId: user-auto-cancel, vehicleId: vehicle-available-3, expires: "прошлое (-5 min)"}
    booking-reserved:   {status: CONFIRMED, userId: user-verified, vehicleId: vehicle-reserved, expires: "+7 min"}
    booking-started:    {status: STARTED, userId: user-with-rental, vehicleId: vehicle-in-use}

  rentals:
    rental-started:    {status: STARTED, userId: user-with-rental, vehicleId: vehicle-in-use, tariff: 8.0 RUB/min}
    rental-finished:   {status: FINISHED, userId: user-for-fine, vehicleId: vehicle-available-5, amount: 480.0 RUB}
    rental-for-refund: {status: PAID, userId: user-for-refund, vehicleId: vehicle-available-5, amount: 240.0 RUB}
    rental-for-retry:  {status: PAYMENT_FAILED, userId: user-for-retry, vehicleId: vehicle-available-5, amount: 360.0 RUB}

  payments:
    payment-failed:   {status: FAILED, rentalId: rental-for-retry, amount: 360.0, retry_count: 0, failure_reason: PROVIDER_TIMEOUT}
    payment-captured: {status: CAPTURED, rentalId: rental-for-refund, amount: 240.0}

# ─── Полный каталог ФЛК-правил ────────────────────────────────────────────
flk_rules_catalog:
  user_checks:
    - code: USER_NOT_FOUND
      http: 404
      condition: "userId не существует в users"
      checked_on: [POST /v1/bookings, GET /v1/users/{userId}]
    - code: USER_NOT_VERIFIED
      http: 409
      condition: "user.status != VERIFIED (NEW, SUSPENDED, FRAUD_CHECK)"
      checked_on: [POST /v1/bookings]
    - code: USER_BLOCKED
      http: 409
      condition: "user.status == BLOCKED"
      checked_on: [POST /v1/bookings]
      note: "проверяется ДО USER_NOT_VERIFIED — BLOCKED имеет приоритет"
    - code: USER_HAS_CRITICAL_DEBT
      http: 409
      condition: "user.has_critical_debt == true"
      checked_on: [POST /v1/bookings]
    - code: USER_HAS_ACTIVE_RENTAL
      http: 409
      condition: "существует rental_session userId + status=STARTED"
      checked_on: [POST /v1/bookings, POST /v1/rentals/start]

  license_checks:
    - code: DRIVER_LICENSE_NOT_FOUND
      http: 409
      condition: "нет записи driver_license для userId"
      checked_on: [POST /v1/bookings]
    - code: DRIVER_LICENSE_REJECTED
      http: 409
      condition: "license.status == REJECTED"
      checked_on: [POST /v1/bookings]
    - code: DRIVER_LICENSE_INVALID
      http: 409
      condition: "license.status != VERIFIED"
      checked_on: [POST /v1/bookings]
    - code: DRIVER_LICENSE_EXPIRED
      http: 409
      condition: "license.expiration_date <= today()"
      checked_on: [POST /v1/bookings]
      note: "граничное значение: expiration_date == today → EXPIRED"

  vehicle_checks:
    - code: VEHICLE_NOT_FOUND
      http: 404
      condition: "vehicleId не существует в vehicles"
      checked_on: [POST /v1/bookings, GET /v1/vehicles/{vehicleId}]
    - code: VEHICLE_NOT_AVAILABLE
      http: 409
      condition: "vehicle.status != AVAILABLE (RESERVED|IN_USE|MAINTENANCE|BLOCKED|OFFLINE)"
      checked_on: [POST /v1/bookings]
    - code: VEHICLE_NOT_RESERVED
      http: 409
      condition: "vehicle.status != RESERVED (при старте аренды)"
      checked_on: [POST /v1/rentals/start]
    - code: VEHICLE_OUTSIDE_ALLOWED_ZONE
      http: 409
      condition: "vehicleId in mock_config.vehicles_outside_zone"
      checked_on: [POST /v1/rentals/{rentalId}/finish]
    - code: ENGINE_NOT_OFF
      http: 409
      condition: "vehicle_telemetry.engine_on == true"
      checked_on: [POST /v1/rentals/{rentalId}/finish]
    - code: DOORS_NOT_CLOSED
      http: 409
      condition: "vehicle_telemetry.doors_closed == false"
      checked_on: [POST /v1/rentals/{rentalId}/finish]
    - code: VEHICLE_MOVING
      http: 409
      condition: "vehicle_telemetry.speed_kmh != 0"
      checked_on: [POST /v1/rentals/{rentalId}/finish]

  booking_checks:
    - code: BOOKING_NOT_FOUND
      http: 404
      condition: "bookingId не существует"
      checked_on: [POST /v1/rentals/start, GET /v1/bookings/{id}, POST /v1/bookings/{id}/cancel]
    - code: BOOKING_STATUS_INVALID
      http: 409
      condition: "booking.status не в допустимом наборе (напр. EXPIRED/CANCELLED для старта)"
      checked_on: [POST /v1/rentals/start, POST /v1/bookings/{id}/cancel, POST /v1/bookings/{id}/expire]
    - code: BOOKING_EXPIRED
      http: 409
      condition: "booking.expires_at < now() (при статусе CONFIRMED)"
      checked_on: [POST /v1/rentals/start]
      note: "граничное значение: expires_at == now() - 1ms → EXPIRED"

  rental_checks:
    - code: RENTAL_NOT_FOUND
      http: 404
      condition: "rentalId не существует в rental_sessions"
      checked_on: [GET /v1/rentals/{id}, POST /v1/rentals/{id}/finish, POST /v1/payments]
    - code: RENTAL_STATUS_INVALID
      http: 409
      condition: "rental.status != STARTED при попытке finish"
      checked_on: [POST /v1/rentals/{rentalId}/finish]
    - code: RENTAL_NOT_FINISHED
      http: 409
      condition: "rental.status не FINISHED при создании платежа"
      checked_on: [POST /v1/payments, POST /v1/payments/{id}/retry]
    - code: RENTAL_NOT_CLOSED
      http: 409
      condition: "rental.status не в {FINISHED, PAID, PAYMENT_FAILED} при штрафе/damage"
      checked_on: [POST /v1/fines, POST /v1/damage-reports]
    - code: RENTAL_FINISH_BLOCKED
      http: 409
      condition: "rentalId in mock_config.rentals_blocked_finish"
      checked_on: [POST /v1/rentals/{rentalId}/finish]

  payment_checks:
    - code: PAYMENT_NOT_FOUND
      http: 404
      condition: "paymentId не существует"
      checked_on: [GET /v1/payments/{id}, POST /v1/payments/{id}/retry, POST /v1/payments/{id}/refund]
    - code: PAYMENT_OPERATION_DUPLICATE
      http: 409
      condition: "уже есть CAPTURED/PAID платёж для данного rentalId"
      checked_on: [POST /v1/payments]
    - code: PAYMENT_NOT_FAILED
      http: 409
      condition: "payment.status != FAILED при retry"
      checked_on: [POST /v1/payments/{id}/retry]
    - code: PAYMENT_RETRY_LIMIT_EXCEEDED
      http: 409
      condition: "payment.retry_count >= 3"
      checked_on: [POST /v1/payments/{id}/retry]
    - code: PAYMENT_ALREADY_REFUNDED
      http: 409
      condition: "payment.status == REFUNDED"
      checked_on: [POST /v1/payments/{id}/refund]
    - code: PAYMENT_NOT_CAPTURABLE
      http: 409
      condition: "payment.status не в {CAPTURED, PAID, PARTIALLY_REFUNDED}"
      checked_on: [POST /v1/payments/{id}/refund]
    - code: PAYMENT_AMOUNT_INVALID
      http: 422
      condition: "amount <= 0 при создании платежа"
      checked_on: [POST /v1/payments]
    - code: REFUND_AMOUNT_INVALID
      http: 422
      condition: "refund amount <= 0"
      checked_on: [POST /v1/payments/{id}/refund]
    - code: REFUND_AMOUNT_TOO_HIGH
      http: 422
      condition: "refund amount > payment.amount"
      checked_on: [POST /v1/payments/{id}/refund]

  service_checks:
    - code: GEO_SERVICE_UNAVAILABLE
      http: 503
      condition: "mock_config.geo_service_available == false"
      checked_on: [POST /v1/rentals/start]
    - code: TELEMETRY_SERVICE_UNAVAILABLE
      http: 503
      condition: "mock_config.telemetry_service_available == false"
      checked_on: [GET /v1/vehicles/{id}/telemetry]

  fine_validation:
    - code: FINE_RENTAL_REQUIRED
      http: 422
      condition: "rentalId отсутствует в теле"
    - code: FINE_USER_REQUIRED
      http: 422
      condition: "userId отсутствует в теле"
    - code: FINE_AMOUNT_INVALID
      http: 422
      condition: "amount отсутствует или <= 0"
    - code: FINE_REASON_REQUIRED
      http: 422
      condition: "reason отсутствует"

  damage_validation:
    - code: DAMAGE_RENTAL_REQUIRED
      http: 422
      condition: "rentalId отсутствует"
    - code: DAMAGE_VEHICLE_REQUIRED
      http: 422
      condition: "vehicleId отсутствует"
    - code: DAMAGE_DESCRIPTION_REQUIRED
      http: 422
      condition: "description отсутствует"
    - code: DAMAGE_SEVERITY_INVALID
      http: 422
      condition: "severity не в {LOW, MEDIUM, HIGH, CRITICAL}"

# ─── Статусные модели сущностей ───────────────────────────────────────────
status_models:
  User:
    values: [NEW, VERIFIED, BLOCKED, SUSPENDED, FRAUD_CHECK]
    booking_allowed: [VERIFIED]
    booking_denied: [BLOCKED, NEW, SUSPENDED, FRAUD_CHECK]

  Vehicle:
    values: [AVAILABLE, RESERVED, IN_USE, MAINTENANCE, BLOCKED, OFFLINE]
    transitions:
      - "AVAILABLE → RESERVED: POST /v1/bookings → 201"
      - "RESERVED → IN_USE: POST /v1/rentals/start → 201"
      - "IN_USE → AVAILABLE: POST /v1/rentals/{id}/finish → 200"
      - "RESERVED → AVAILABLE: POST /v1/bookings/{id}/cancel|expire → 200"
    forbidden:
      - "MAINTENANCE → IN_USE (запрещено)"
      - "BLOCKED → RESERVED (запрещено)"

  Booking:
    values: [CREATED, CONFIRMED, STARTED, CANCELLED, EXPIRED, CLOSED, FAILED]
    transitions:
      - "→ CONFIRMED: POST /v1/bookings → 201"
      - "CONFIRMED → STARTED: POST /v1/rentals/start → 201"
      - "CONFIRMED → CANCELLED: POST /v1/bookings/{id}/cancel → 200"
      - "CONFIRMED → EXPIRED: POST /v1/bookings/{id}/expire → 200"
    forbidden:
      - "CANCELLED → STARTED"
      - "EXPIRED → STARTED"
    ttl: "15 минут от created_at"

  RentalSession:
    values: [CREATED, STARTED, FINISHED, FAILED, PAYMENT_PENDING, PAYMENT_FAILED, PAID, MANUAL_REVIEW]
    transitions:
      - "→ STARTED: POST /v1/rentals/start → 201"
      - "STARTED → FINISHED: POST /v1/rentals/{id}/finish → 200"
      - "FINISHED → PAID: POST /v1/payments → 201 (CAPTURED)"
      - "FINISHED → PAYMENT_FAILED: POST /v1/payments → 201 (FAILED provider)"
      - "PAYMENT_FAILED → PAID: POST /v1/payments/{id}/retry → 200 (CAPTURED)"
    forbidden:
      - "FINISHED → STARTED"
      - "PAID → STARTED"

  Payment:
    values: [NEW, AUTHORIZED, CAPTURED, PAID, FAILED, RETRYING, PARTIALLY_REFUNDED, REFUNDED]
    transitions:
      - "→ CAPTURED: POST /v1/payments → 201 (provider ok)"
      - "→ FAILED: POST /v1/payments → 201 (provider fail)"
      - "FAILED → CAPTURED: POST /v1/payments/{id}/retry → 200"
      - "CAPTURED → REFUNDED: POST /v1/payments/{id}/refund → 201 (full)"
      - "CAPTURED → PARTIALLY_REFUNDED: POST /v1/payments/{id}/refund → 201 (partial)"
    forbidden:
      - "REFUNDED → CAPTURED"

# ─── Kafka outbox-события ───────────────────────────────────────────────
outbox_events:
  BOOKING_CREATED: "POST /v1/bookings → 201"
  BOOKING_CANCELLED: "POST /v1/bookings/{id}/cancel → 200"
  BOOKING_EXPIRED: "POST /v1/bookings/{id}/expire → 200"
  RENTAL_STARTED: "POST /v1/rentals/start → 201"
  RENTAL_FINISHED: "POST /v1/rentals/{id}/finish → 200"
  VEHICLE_RELEASED: "POST /v1/rentals/{id}/finish → 200"
  PAYMENT_CAPTURED: "POST /v1/payments → 201 (success) | POST /v1/payments/{id}/retry → success"
  PAYMENT_FAILED: "POST /v1/payments → 201 (fail) | retry fail"
  NOTIFICATION_REQUESTED: "после PAYMENT_CAPTURED"
  PAYMENT_REFUNDED: "POST /v1/payments/{id}/refund → 201"
  FINE_CREATED: "POST /v1/fines → 201"
  DAMAGE_REPORT_CREATED: "POST /v1/damage-reports → 201"

# ─── Техники тест-дизайна ──────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    description: "Разбиение входных данных на классы эквивалентности. Один тест на класс."
    applies_to: "Статусы пользователя, авто, бронирования; типы ошибок ФЛК"

  boundary_value_analysis:
    description: "Тестирование граничных значений"
    key_boundaries:
      - "booking_ttl: expires_at = now() — 1ms → BOOKING_EXPIRED"
      - "license_expiry: expiration_date == today → DRIVER_LICENSE_EXPIRED"
      - "retry_count: 2 → ok, 3 → PAYMENT_RETRY_LIMIT_EXCEEDED"
      - "refund_amount: = payment.amount → REFUNDED, > payment.amount → REFUND_AMOUNT_TOO_HIGH"
      - "fine_amount: 0 → FINE_AMOUNT_INVALID, 0.01 → ok"
      - "telemetry speed_kmh: 0 → ok, 1 → VEHICLE_MOVING"

  state_transition_testing:
    description: "Проверка переходов через API-запросы. Позитивные и запрещённые переходы."
    entities: [Vehicle, Booking, RentalSession, Payment]

  decision_table:
    description: "Таблица решений для комбинаций условий"
    applies_to: "POST /v1/bookings (5+ условий ФЛК), POST /v1/payments (provider + status)"

  pairwise_testing:
    description: "Попарное покрытие комбинаций. Применять к штрафам (тип нарушения × сумма) и damage reports (severity × photoUrls)."

  negative_testing:
    description: "Тесты запрещённых операций и отсутствующих ресурсов"
    categories:
      - "404: несуществующие ID сущностей"
      - "409: нарушения бизнес-правил (ФЛК)"
      - "422: невалидные поля запроса"
      - "503: недоступные внешние сервисы"

  idempotency_testing:
    description: "Повторный вызов одной операции — результат должен быть детерминированным"
    endpoints_to_check:
      - "POST /v1/rentals/{id}/finish (case 012)"
      - "POST /v1/bookings/{id}/expire"
      - "POST /v1/bookings/{id}/cancel"

# ─── Стандартные правила оценки покрытия ─────────────────────────────────
coverage_rules:
  mandatory_checks_per_scenario:
    - "Позитивный сценарий (happy path) — полная цепочка API"
    - "Все применимые ФЛК-правила — минимум один негативный тест каждого"
    - "Статус всех затронутых сущностей до и после"
    - "Наличие/отсутствие ожидаемых событий в outbox (GET /mock/outbox)"
    - "Аудит-записи для критичных изменений (GET /mock/audit)"
    - "POST /mock/reset перед каждым сценарием"
    - "Граничные значения для полей с диапазонами"
    - "Поведение при недоступных внешних сервисах (если применимо)"
