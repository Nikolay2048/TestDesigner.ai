openapi: 3.0.3
info:
  title: Carsharing Mock API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /v1/vehicles/available:
    $ref: "./paths/vehicles_available.yaml"

  /v1/bookings:
    $ref: "./paths/bookings.yaml"

  /v1/bookings/{bookingId}:
    $ref: "./paths/booking_by_id.yaml"

  /v1/bookings/{bookingId}/cancel:
    $ref: "./paths/booking_cancel.yaml"

  # ─── DTP (ДТП) ───────────────────────────────────────────────────────────────

  /v1/accidents:
    post:
      summary: Зарегистрировать ДТП
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/CreateAccidentRequest.yaml"
            example:
              date: "2026-05-17T10:00:00Z"
              location: "ул. Ленина 42, Москва"
              description: "Столкновение на перекрёстке"
      responses:
        "201":
          description: ДТП зарегистрировано
          content:
            application/json:
              schema:
                $ref: "./schemas/Accident.yaml"
              example:
                accidentId: "accident-1"
                date: "2026-05-17T10:00:00Z"
                location: "ул. Ленина 42, Москва"
                description: "Столкновение на перекрёстке"
                status: "REGISTERED"
                participantsCount: 0
                totalDamageAmount: 0.0
        "400":
          description: Отсутствуют обязательные поля
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    get:
      summary: Получить список ДТП
      responses:
        "200":
          description: Список ДТП
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/Accident.yaml"

  /v1/accidents/{accidentId}:
    get:
      summary: Получить ДТП по идентификатору
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
      responses:
        "200":
          description: Данные ДТП
          content:
            application/json:
              schema:
                $ref: "./schemas/Accident.yaml"
              example:
                accidentId: "accident-1"
                date: "2026-05-17T10:00:00Z"
                location: "ул. Ленина 42, Москва"
                description: "Столкновение на перекрёстке"
                status: "REGISTERED"
                participantsCount: 2
                totalDamageAmount: 45000.0
        "404":
          description: ДТП не найдено
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/participants:
    post:
      summary: Добавить участника ДТП
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/CreateParticipantRequest.yaml"
            example:
              role: "CULPRIT"
              name: "Иван Иванов"
              phone: "+79161234567"
              insurancePolicy: "POL-001-2026"
              faultPercentage: 100
      responses:
        "201":
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: "./schemas/AccidentParticipant.yaml"
              example:
                participantId: "participant-1"
                accidentId: "accident-1"
                role: "CULPRIT"
                name: "Иван Иванов"
                phone: "+79161234567"
                insurancePolicy: "POL-001-2026"
                faultPercentage: 100
                status: "ACTIVE"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "404":
          description: ДТП не найдено
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    get:
      summary: Получить список участников ДТП
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
      responses:
        "200":
          description: Список участников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/AccidentParticipant.yaml"
        "404":
          description: ДТП не найдено
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/participants/{participantId}:
    get:
      summary: Получить участника ДТП по идентификатору
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          example: "participant-1"
      responses:
        "200":
          description: Данные участника
          content:
            application/json:
              schema:
                $ref: "./schemas/AccidentParticipant.yaml"
        "404":
          description: ДТП или участник не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    patch:
      summary: Обновить данные участника ДТП
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          example: "participant-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                faultPercentage:
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 70
                status:
                  type: string
                  enum: [ACTIVE, WITHDRAWN]
                  example: "WITHDRAWN"
      responses:
        "200":
          description: Участник обновлён
          content:
            application/json:
              schema:
                $ref: "./schemas/AccidentParticipant.yaml"
        "404":
          description: ДТП или участник не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/participants/{participantId}/vehicles:
    post:
      summary: Добавить транспортное средство участника
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          example: "participant-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/CreateAccidentVehicleRequest.yaml"
            example:
              licensePlate: "А123ВС77"
              brand: "Toyota"
              model: "Camry"
              damageDescription: "Повреждён передний бампер"
              damageAmount: 45000.0
      responses:
        "201":
          description: ТС добавлено
          content:
            application/json:
              schema:
                $ref: "./schemas/AccidentVehicle.yaml"
              example:
                accidentVehicleId: "acc-vehicle-1"
                participantId: "participant-1"
                licensePlate: "А123ВС77"
                brand: "Toyota"
                model: "Camry"
                damageDescription: "Повреждён передний бампер"
                damageAmount: 45000.0
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "404":
          description: ДТП или участник не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    get:
      summary: Получить транспортные средства участника
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          example: "participant-1"
      responses:
        "200":
          description: Список ТС участника
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/AccidentVehicle.yaml"
        "404":
          description: ДТП или участник не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims:
    post:
      summary: Создать страховое требование по ДТП
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/CreateClaimRequest.yaml"
            example:
              claimantParticipantId: "participant-2"
              claimedAmount: 85000.0
      responses:
        "201":
          description: Требование создано
          content:
            application/json:
              schema:
                $ref: "./schemas/InsuranceClaim.yaml"
              example:
                claimId: "claim-1"
                accidentId: "accident-1"
                claimantParticipantId: "participant-2"
                status: "DRAFT"
                claimedAmount: 0.0
                approvedAmount: 0.0
                rejectionReason: null
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "404":
          description: ДТП или участник не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "409":
          description: Требование для данного участника уже существует
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    get:
      summary: Получить список требований по ДТП
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
      responses:
        "200":
          description: Список требований
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/InsuranceClaim.yaml"
        "404":
          description: ДТП не найдено
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}:
    get:
      summary: Получить страховое требование по идентификатору
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
      responses:
        "200":
          description: Данные требования
          content:
            application/json:
              schema:
                $ref: "./schemas/InsuranceClaim.yaml"
        "404":
          description: ДТП или требование не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    patch:
      summary: Обновить страховое требование (только в статусе DRAFT)
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/UpdateClaimRequest.yaml"
            example:
              claimedAmount: 85000.0
              description: "Уточнённая сумма после оценки"
      responses:
        "200":
          description: Требование обновлено
          content:
            application/json:
              schema:
                $ref: "./schemas/InsuranceClaim.yaml"
        "404":
          description: ДТП или требование не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "409":
          description: Требование не в статусе DRAFT
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}/submit:
    post:
      summary: Подать требование на рассмотрение (DRAFT → SUBMITTED)
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
      responses:
        "200":
          description: Требование подано
          content:
            application/json:
              schema:
                $ref: "./schemas/InsuranceClaim.yaml"
        "400":
          description: Сумма требования не указана
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "404":
          description: ДТП или требование не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}/assessments:
    post:
      summary: Создать экспертную оценку по требованию
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/CreateAssessmentRequest.yaml"
            example:
              expertName: "Сергей Оценщиков"
              scheduledDate: "2026-05-20T10:00:00Z"
      responses:
        "201":
          description: Оценка назначена
          content:
            application/json:
              schema:
                $ref: "./schemas/ExpertAssessment.yaml"
              example:
                assessmentId: "assessment-1"
                claimId: "claim-1"
                expertName: "Сергей Оценщиков"
                scheduledDate: "2026-05-20T10:00:00Z"
                completedDate: null
                assessedAmount: 0.0
                report: null
                status: "SCHEDULED"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "404":
          description: ДТП или требование не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}/assessments/{assessmentId}:
    get:
      summary: Получить экспертную оценку по идентификатору
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
        - name: assessmentId
          in: path
          required: true
          schema:
            type: string
          example: "assessment-1"
      responses:
        "200":
          description: Данные оценки
          content:
            application/json:
              schema:
                $ref: "./schemas/ExpertAssessment.yaml"
        "404":
          description: ДТП, требование или оценка не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    patch:
      summary: Обновить экспертную оценку
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
        - name: assessmentId
          in: path
          required: true
          schema:
            type: string
          example: "assessment-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/UpdateAssessmentRequest.yaml"
            example:
              assessedAmount: 78500.0
              report: "Задний бампер деформирован, замена боковой панели"
              status: "COMPLETED"
      responses:
        "200":
          description: Оценка обновлена
          content:
            application/json:
              schema:
                $ref: "./schemas/ExpertAssessment.yaml"
        "404":
          description: ДТП, требование или оценка не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}/payments:
    post:
      summary: Создать страховую выплату по требованию
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/CreateDTPPaymentRequest.yaml"
            example:
              amount: 78500.0
      responses:
        "201":
          description: Выплата создана
          content:
            application/json:
              schema:
                $ref: "./schemas/DTPPayment.yaml"
              example:
                paymentId: "dtp-payment-1"
                claimId: "claim-1"
                claimantParticipantId: "participant-2"
                amount: 78500.0
                status: "PENDING"
                confirmedAt: null
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "404":
          description: ДТП или требование не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "409":
          description: Выплата уже существует
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
    get:
      summary: Получить список выплат по требованию
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
      responses:
        "200":
          description: Список выплат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/DTPPayment.yaml"
        "404":
          description: ДТП или требование не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}/payments/{paymentId}:
    get:
      summary: Получить выплату по идентификатору
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
          example: "dtp-payment-1"
      responses:
        "200":
          description: Данные выплаты
          content:
            application/json:
              schema:
                $ref: "./schemas/DTPPayment.yaml"
        "404":
          description: ДТП, требование или выплата не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

  /v1/accidents/{accidentId}/claims/{claimId}/payments/{paymentId}/confirm:
    post:
      summary: Подтвердить страховую выплату (PENDING → CONFIRMED)
      parameters:
        - name: accidentId
          in: path
          required: true
          schema:
            type: string
          example: "accident-1"
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: "claim-1"
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
          example: "dtp-payment-1"
      responses:
        "200":
          description: Выплата подтверждена
          content:
            application/json:
              schema:
                $ref: "./schemas/DTPPayment.yaml"
        "404":
          description: ДТП, требование или выплата не найдены
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"
        "409":
          description: Выплата не в статусе PENDING
          content:
            application/json:
              schema:
                $ref: "./schemas/ErrorResponse.yaml"

components:
  schemas:
    Vehicle:
      $ref: "./schemas/Vehicle.yaml"

    AvailableVehiclesResponse:
      $ref: "./schemas/AvailableVehiclesResponse.yaml"

    CreateBookingRequest:
      $ref: "./schemas/CreateBookingRequest.yaml"

    BookingResponse:
      $ref: "./schemas/BookingResponse.yaml"

    ErrorResponse:
      $ref: "./schemas/ErrorResponse.yaml"

    Accident:
      $ref: "./schemas/Accident.yaml"

    CreateAccidentRequest:
      $ref: "./schemas/CreateAccidentRequest.yaml"

    AccidentParticipant:
      $ref: "./schemas/AccidentParticipant.yaml"

    CreateParticipantRequest:
      $ref: "./schemas/CreateParticipantRequest.yaml"

    AccidentVehicle:
      $ref: "./schemas/AccidentVehicle.yaml"

    CreateAccidentVehicleRequest:
      $ref: "./schemas/CreateAccidentVehicleRequest.yaml"

    InsuranceClaim:
      $ref: "./schemas/InsuranceClaim.yaml"

    CreateClaimRequest:
      $ref: "./schemas/CreateClaimRequest.yaml"

    UpdateClaimRequest:
      $ref: "./schemas/UpdateClaimRequest.yaml"

    ExpertAssessment:
      $ref: "./schemas/ExpertAssessment.yaml"

    CreateAssessmentRequest:
      $ref: "./schemas/CreateAssessmentRequest.yaml"

    UpdateAssessmentRequest:
      $ref: "./schemas/UpdateAssessmentRequest.yaml"

    DTPPayment:
      $ref: "./schemas/DTPPayment.yaml"

    CreateDTPPaymentRequest:
      $ref: "./schemas/CreateDTPPaymentRequest.yaml"
