parameters:
  - name: reservationId
    in: path
    required: true
    schema: { type: string }
post:
  tags: [reservation]
  summary: Add extras to reservation
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/ExtrasRequest'
  responses:
    '200':
      description: Reservation with extras
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Reservation'
    '404': { $ref: '../components/responses.yaml#/NotFound' }
    '409': { $ref: '../components/responses.yaml#/Conflict' }
