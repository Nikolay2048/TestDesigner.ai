get:
  summary: Get available vehicles
  operationId: getAvailableVehicles

  parameters:
    - name: city
      in: query
      required: false
      schema:
        type: string
        example: Moscow

  responses:
    "200":
      description: Available vehicles found
      content:
        application/json:
          schema:
            $ref: "../schemas/AvailableVehiclesResponse.yaml"

    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
