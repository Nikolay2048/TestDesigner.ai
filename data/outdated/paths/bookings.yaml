post:
  summary: Create booking
  operationId: createBooking

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/CreateBookingRequest.yaml"

  responses:
    "201":
      description: Booking created
      content:
        application/json:
          schema:
            $ref: "../schemas/BookingResponse.yaml"

    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"

    "404":
      description: Vehicle not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"

    "409":
      description: Vehicle already booked
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
