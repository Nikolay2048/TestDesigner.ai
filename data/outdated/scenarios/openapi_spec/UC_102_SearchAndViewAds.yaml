openapi: 3.0.3
info:
  title: UC_102_SearchAndViewAds
  version: 1.0.0
  description: Поиск опубликованных объявлений с фильтрацией и просмотр карточки объявления.
servers:
  - url: https://api.example.com
    description: Example API host
paths:
  /api/bb/v1/ads:
    get:
      tags:
        - Ads
      summary: Search published ads
      description: Возвращает постраничный список опубликованных объявлений с фильтрацией. Авторизация не требуется.
      operationId: searchAds
      parameters:
        - $ref: '#/components/parameters/CategoryQueryParam'
        - $ref: '#/components/parameters/CityQueryParam'
        - $ref: '#/components/parameters/PriceMinQueryParam'
        - $ref: '#/components/parameters/PriceMaxQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/PageSizeQueryParam'
      responses:
        '200':
          description: Список объявлений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAdsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/bb/v1/ads/{adId}:
    get:
      tags:
        - Ads
      summary: Get ad details
      description: Возвращает полную карточку объявления. Инкрементирует viewCount. Авторизация не требуется.
      operationId: getAdDetails
      parameters:
        - $ref: '#/components/parameters/AdIdPathParam'
      responses:
        '200':
          description: Карточка объявления.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    AdIdPathParam:
      name: adId
      in: path
      required: true
      description: UUID объявления.
      schema:
        type: string
        format: uuid
    CategoryQueryParam:
      name: category
      in: query
      required: false
      description: Фильтр по категории.
      schema:
        $ref: '#/components/schemas/AdCategory'
    CityQueryParam:
      name: city
      in: query
      required: false
      description: Фильтр по городу.
      schema:
        type: string
        example: Moscow
    PriceMinQueryParam:
      name: priceMin
      in: query
      required: false
      description: Минимальная цена (включительно).
      schema:
        type: number
        format: decimal
        minimum: 0
        example: 1000.00
    PriceMaxQueryParam:
      name: priceMax
      in: query
      required: false
      description: Максимальная цена (включительно). Должна быть >= priceMin если оба указаны.
      schema:
        type: number
        format: decimal
        minimum: 0
        example: 100000.00
    PageQueryParam:
      name: page
      in: query
      required: false
      description: Номер страницы (начиная с 1).
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PageSizeQueryParam:
      name: pageSize
      in: query
      required: false
      description: Размер страницы. Максимум 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

  responses:
    ValidationError:
      description: Ошибка валидации параметров.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            priceRangeInvalid:
              summary: priceMin превышает priceMax
              value:
                errorCode: BB-SEARCH-001
                message: priceMin must not exceed priceMax
            invalidCategory:
              summary: Недопустимая категория
              value:
                errorCode: BB-SEARCH-002
                message: category is not supported
            pageSizeTooLarge:
              summary: pageSize превышает 100
              value:
                errorCode: BB-SEARCH-003
                message: pageSize must not exceed 100
    NotFoundError:
      description: Объявление не найдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            adNotFound:
              summary: adId не существует
              value:
                errorCode: BB-AD-030
                message: ad not found
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SearchAdsResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdSummary'
        total:
          type: integer
          description: Общее количество объявлений, соответствующих фильтрам.
          example: 1
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20

    AdSummary:
      type: object
      required:
        - adId
        - title
        - price
        - currency
        - category
        - city
        - status
        - viewCount
      properties:
        adId:
          type: string
          format: uuid
        title:
          type: string
          example: iPhone 14 Pro
        price:
          type: number
          format: decimal
          example: 75000.00
        currency:
          $ref: '#/components/schemas/AdCurrency'
        category:
          $ref: '#/components/schemas/AdCategory'
        city:
          type: string
          example: Moscow
        status:
          $ref: '#/components/schemas/AdStatus'
        viewCount:
          type: integer
          minimum: 0
          example: 5

    AdDetails:
      type: object
      required:
        - adId
        - authorId
        - title
        - description
        - price
        - currency
        - category
        - city
        - status
        - viewCount
        - createdAt
      properties:
        adId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
          example: iPhone 14 Pro в отличном состоянии
        description:
          type: string
          example: Продаю iPhone 14 Pro, 256 GB, Space Black. Полный комплект.
        price:
          type: number
          format: decimal
          example: 75000.00
        currency:
          $ref: '#/components/schemas/AdCurrency'
        category:
          $ref: '#/components/schemas/AdCategory'
        city:
          type: string
          example: Moscow
        status:
          $ref: '#/components/schemas/AdStatus'
        viewCount:
          type: integer
          minimum: 0
          example: 6
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    AdCategory:
      type: string
      enum:
        - ELECTRONICS
        - CLOTHING
        - FURNITURE
        - TRANSPORT
        - SERVICES
        - OTHER
      example: ELECTRONICS

    AdCurrency:
      type: string
      enum:
        - RUB
        - USD
        - EUR
      example: RUB

    AdStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - CLOSED
      example: PUBLISHED

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          example: BB-SEARCH-001
        message:
          type: string
          example: Validation error
