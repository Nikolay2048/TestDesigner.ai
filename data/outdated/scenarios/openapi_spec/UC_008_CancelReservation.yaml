openapi: 3.0.3
info:
  title: UC_008_CancelReservation
  version: 1.0.0
  description: Отмена подтверждённого бронирования с расчётом и выплатой возврата по тарифной политике.
servers:
  - url: https://api.example.com
    description: Example API host
paths:
  /api/v1/reservations/{reservationId}:
    get:
      tags:
        - Reservations
      summary: Get reservation details
      description: Возвращает детали бронирования. В UC_008 используется для проверки статуса CONFIRMED и получения depositAmount.
      operationId: getReservationForCancel
      parameters:
        - $ref: '#/components/parameters/ReservationIdPathParam'
      responses:
        '200':
          description: Бронирование найдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reservations/{reservationId}/cancellation-policy:
    get:
      tags:
        - Reservations
      summary: Get cancellation policy
      description: Возвращает снимок политики отмены на текущий момент — tier, процент штрафа, сумму возврата и cancellationPolicyId.
      operationId: getCancellationPolicy
      parameters:
        - $ref: '#/components/parameters/ReservationIdPathParam'
      responses:
        '200':
          description: Политика отмены получена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPolicyResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reservations/{reservationId}/cancel:
    post:
      tags:
        - Reservations
      summary: Cancel reservation
      description: Отменяет подтверждённое бронирование. Требует cancellationPolicyId из предыдущего шага. Освобождает блокировку авто.
      operationId: cancelReservation
      parameters:
        - $ref: '#/components/parameters/ReservationIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Бронирование отменено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReservationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/refunds/{cancellationId}:
    get:
      tags:
        - Refunds
      summary: Get refund status
      description: Возвращает текущий статус возврата средств по отменённому бронированию.
      operationId: getRefundStatus
      parameters:
        - $ref: '#/components/parameters/CancellationIdPathParam'
      responses:
        '200':
          description: Статус возврата получен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundStatusResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    ReservationIdPathParam:
      name: reservationId
      in: path
      required: true
      description: UUID бронирования.
      schema:
        type: string
        format: uuid
    CancellationIdPathParam:
      name: cancellationId
      in: path
      required: true
      description: UUID записи об отмене (из ответа cancel).
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Ошибка валидации входных параметров.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingPolicyId:
              summary: cancellationPolicyId не передан
              value:
                errorCode: CANCEL-001
                message: cancellationPolicyId is required
            missingReason:
              summary: reason не передан
              value:
                errorCode: CANCEL-002
                message: reason is required
    BusinessRuleError:
      description: Нарушение бизнес-правила.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notConfirmed:
              summary: Бронирование не в статусе CONFIRMED
              value:
                errorCode: CANCEL-010
                message: only CONFIRMED reservations can be cancelled
            rentalAlreadyStarted:
              summary: Аренда уже началась
              value:
                errorCode: CANCEL-011
                message: cannot cancel reservation after rental has started
    ConflictError:
      description: Конфликт состояния.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            alreadyCancelled:
              summary: Бронирование уже отменено
              value:
                errorCode: CANCEL-009
                message: reservation is already cancelled
            stalePolicyId:
              summary: Политика отмены устарела
              value:
                errorCode: CANCEL-012
                message: cancellationPolicyId does not match the current reservation
    NotFoundError:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            reservationNotFound:
              summary: Бронирование не найдено
              value:
                errorCode: RESERVATION-GET-001
                message: reservation not found
            refundNotFound:
              summary: Запись о возврате не найдена
              value:
                errorCode: REFUND-GET-001
                message: refund record not found for given cancellationId
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ReservationResponse:
      type: object
      required:
        - reservationId
        - status
        - carId
        - customerId
        - cityId
        - dateFrom
        - dateTo
        - depositAmount
        - currency
      properties:
        reservationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReservationStatus'
        carId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        cityId:
          type: integer
          enum:
            - 36
            - 77
          example: 77
        dateFrom:
          type: string
          format: date-time
        dateTo:
          type: string
          format: date-time
        depositAmount:
          type: number
          format: decimal
          example: 10000.00
        currency:
          $ref: '#/components/schemas/Currency'

    CancellationPolicyResponse:
      type: object
      required:
        - cancellationPolicyId
        - policyTier
        - hoursUntilPickup
        - cancellationFeePercent
        - cancellationFeeAmount
        - refundAmount
        - currency
        - policyDescription
      properties:
        cancellationPolicyId:
          type: string
          format: uuid
        policyTier:
          $ref: '#/components/schemas/CancellationTier'
        hoursUntilPickup:
          type: number
          format: decimal
          minimum: 0
          example: 72.5
        cancellationFeePercent:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          example: 0
        cancellationFeeAmount:
          type: number
          format: decimal
          minimum: 0
          example: 0.00
        refundAmount:
          type: number
          format: decimal
          minimum: 0
          example: 10000.00
        currency:
          $ref: '#/components/schemas/Currency'
        policyDescription:
          type: string
          example: 'Free cancellation: more than 48 hours before pickup'

    CancelReservationRequest:
      type: object
      required:
        - cancellationPolicyId
        - reason
      properties:
        cancellationPolicyId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/CancellationReason'

    CancelReservationResponse:
      type: object
      required:
        - cancellationId
        - status
        - refundAmount
        - currency
        - cancelledAt
      properties:
        cancellationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - CANCELLED
          example: CANCELLED
        refundAmount:
          type: number
          format: decimal
          minimum: 0
          example: 10000.00
        currency:
          $ref: '#/components/schemas/Currency'
        cancelledAt:
          type: string
          format: date-time

    RefundStatusResponse:
      type: object
      required:
        - refundId
        - cancellationId
        - refundAmount
        - currency
        - refundStatus
        - estimatedArrivalDays
        - paymentMethodUsed
      properties:
        refundId:
          type: string
          format: uuid
        cancellationId:
          type: string
          format: uuid
        refundAmount:
          type: number
          format: decimal
          minimum: 0
          example: 10000.00
        currency:
          $ref: '#/components/schemas/Currency'
        refundStatus:
          $ref: '#/components/schemas/RefundStatus'
        estimatedArrivalDays:
          type: integer
          minimum: 0
          maximum: 10
          example: 3
        paymentMethodUsed:
          $ref: '#/components/schemas/PaymentMethod'

    ReservationStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
        - EXPIRED
        - COMPLETED
      example: CONFIRMED

    CancellationTier:
      type: string
      enum:
        - FREE
        - PARTIAL
        - NO_REFUND
      description: |
        FREE — отмена > 48ч до выдачи, возврат 100%.
        PARTIAL — 24–48ч до выдачи, возврат 50%.
        NO_REFUND — < 24ч до выдачи, возврат 0%.
      example: FREE

    CancellationReason:
      type: string
      enum:
        - PLANS_CHANGED
        - EMERGENCY
        - FOUND_BETTER_OPTION
        - OTHER
      example: PLANS_CHANGED

    RefundStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
      example: PENDING

    PaymentMethod:
      type: string
      enum:
        - CARD
        - WALLET
      example: CARD

    Currency:
      type: string
      enum:
        - RUB
        - USD
        - EUR
      example: RUB

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          example: CANCEL-001
        message:
          type: string
          example: Validation error
