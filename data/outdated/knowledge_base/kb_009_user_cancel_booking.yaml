# ═══════════════════════════════════════════════════════════════════════
# KB-009 — Отмена бронирования пользователем
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-009
title: "Успешная отмена активного бронирования пользователем"
type: positive
category: booking_cancel
chain_id: POS-009

source_files:
  business_requirements: "data/cases/case_009_user_cancel_booking/01_business_requirements.md"
  system_analysis: "data/cases/case_009_user_cancel_booking/02_system_analysis.md"
  openapi: "data/cases/case_009_user_cancel_booking/03_openapi.yaml"
  flk_rules: "data/cases/case_009_user_cancel_booking/04_flk_rules.yaml"
  status_matrix: "data/cases/case_009_user_cancel_booking/05_status_transition_matrix.yaml"

summary: >
  Пользователь может отменить активное бронирование (CONFIRMED).
  После отмены: booking → CANCELLED, vehicle → AVAILABLE, BOOKING_CANCELLED в outbox.
  cancel_reason сохраняется в бронировании.
  Повторная отмена → 409 BOOKING_STATUS_INVALID.
  Попытка старта аренды по CANCELLED бронированию → 409.
  После освобождения авто новое бронирование на него должно быть возможным.

business_goals:
  - "Клиент может отменить бронирование до начала аренды"
  - "После отмены авто немедленно освобождается для других клиентов"
  - "Причина отмены сохраняется в системе"
  - "Повторная отмена запрещена"

preconditions:
  setup_call: "POST /mock/reset"
  seed_state:
    booking_to_cancel:
      id: "booking-to-cancel"
      status: CONFIRMED
      userId: "user-for-cancel"
      vehicleId: "vehicle-available-2"
      expires_at: "+10 min"
    vehicle_available_2: {status: RESERVED}

api_chain:
  - step: 1
    name: "Проверить статус бронирования — CONFIRMED"
    method: GET
    path: /v1/bookings/booking-to-cancel
    expected_status: 200
    assert:
      - "response.status == 'CONFIRMED'"
      - "response.userId == 'user-for-cancel'"
      - "response.vehicleId == 'vehicle-available-2'"

  - step: 2
    name: "Проверить статус авто — RESERVED"
    method: GET
    path: /v1/vehicles/vehicle-available-2
    expected_status: 200
    assert:
      - "response.status == 'RESERVED'"

  - step: 3
    name: "Отменить бронирование с указанием причины"
    method: POST
    path: /v1/bookings/booking-to-cancel/cancel
    request_body: {reason: "CHANGED_MIND"}
    expected_status: 200
    assert:
      - "response.status == 'CANCELLED'"
      - "response.cancel_reason == 'CHANGED_MIND'"
      - "response.cancelled_at не пустой"

  - step: 4
    name: "Авто вернулось в AVAILABLE"
    method: GET
    path: /v1/vehicles/vehicle-available-2
    expected_status: 200
    assert:
      - "response.status == 'AVAILABLE'"
      - "response.available_for_booking == true"

  - step: 5
    name: "Повторная отмена → 409 BOOKING_STATUS_INVALID"
    method: POST
    path: /v1/bookings/booking-to-cancel/cancel
    request_body: {reason: "DUPLICATE"}
    expected_status: 409
    assert:
      - "response.error == 'BOOKING_STATUS_INVALID'"

  - step: 6
    name: "Попытка старта аренды по CANCELLED бронированию → 409"
    method: POST
    path: /v1/rentals/start
    request_body: {bookingId: "booking-to-cancel"}
    expected_status: 409
    assert:
      - "response.error == 'BOOKING_STATUS_INVALID'"

  - step: 7
    name: "Новое бронирование на освободившееся авто → 201 (контраст)"
    method: POST
    path: /v1/bookings
    request_body: {userId: "user-verified", vehicleId: "vehicle-available-2"}
    expected_status: 201
    assert:
      - "response.status == 'CONFIRMED'"

  - step: 8
    name: "Outbox содержит BOOKING_CANCELLED"
    method: GET
    path: "/mock/outbox?type=BOOKING_CANCELLED"
    expected_status: 200
    assert:
      - "count >= 1"
      - "событие содержит bookingId == 'booking-to-cancel'"

  - step: 9
    name: "Outbox содержит BOOKING_CREATED для нового бронирования"
    method: GET
    path: "/mock/outbox?type=BOOKING_CREATED"
    expected_status: 200
    assert:
      - "count >= 1"

# ─── ФЛК-правила ─────────────────────────────────────────────────────
flk_rules:
  - id: FLK-BOOKING-CANCEL-ALREADY-CANCELLED
    endpoint: POST /v1/bookings/{bookingId}/cancel
    condition: "booking.status == CANCELLED (повторная отмена)"
    test_seed: "booking-to-cancel (после первой отмены)"
    expected_status: 409
    expected_error_code: BOOKING_STATUS_INVALID

  - id: FLK-BOOKING-CANCEL-EXPIRED
    endpoint: POST /v1/bookings/{bookingId}/cancel
    condition: "booking.status == EXPIRED"
    test_seed: "booking-expired"
    expected_status: 409
    expected_error_code: BOOKING_STATUS_INVALID

  - id: FLK-BOOKING-NOT-FOUND-CANCEL
    endpoint: POST /v1/bookings/{bookingId}/cancel
    condition: "bookingId не существует"
    test_input: "booking-nonexistent"
    expected_status: 404
    expected_error_code: BOOKING_NOT_FOUND

  - id: FLK-START-AFTER-CANCEL
    endpoint: POST /v1/rentals/start
    condition: "booking.status == CANCELLED"
    test_seed: "booking-to-cancel (после отмены)"
    expected_status: 409
    expected_error_code: BOOKING_STATUS_INVALID

# ─── Переходы статусов ─────────────────────────────────────────────────
status_transitions:
  - entity: booking
    transitions:
      - {from: CONFIRMED, to: CANCELLED, trigger: "POST /v1/bookings/{id}/cancel → 200"}
    forbidden:
      - {from: CANCELLED, to: STARTED}
      - {from: CANCELLED, to: CONFIRMED}

  - entity: vehicle
    transitions:
      - {from: RESERVED, to: AVAILABLE, trigger: "booking CONFIRMED → CANCELLED"}

expected_outbox_events:
  on_cancel:
    - {event_type: BOOKING_CANCELLED, verify: "GET /mock/outbox?type=BOOKING_CANCELLED"}
  must_not_appear:
    - "RENTAL_STARTED (при отмене)"

# ─── Техники тест-дизайна ─────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    valid_class: "booking.status in {CONFIRMED, STARTED} → 200 CANCELLED"
    invalid_classes:
      - "booking.status == CANCELLED → 409 BOOKING_STATUS_INVALID"
      - "booking.status == EXPIRED → 409 BOOKING_STATUS_INVALID"
      - "booking не существует → 404 BOOKING_NOT_FOUND"

  boundary_testing:
    - "Отмена с reason="" (пустая строка) — что сохраняется в cancel_reason?"
    - "Отмена без тела запроса — cancel_reason должен получить дефолтное значение"

coverage_checklist:
  positive:
    - "[ ] Успешная отмена CONFIRMED бронирования"
    - "[ ] cancel_reason сохраняется"
    - "[ ] vehicle.status = AVAILABLE после отмены"
    - "[ ] BOOKING_CANCELLED в outbox"
    - "[ ] Новое бронирование на освободившееся авто"
  negative:
    - "[ ] Повторная отмена → BOOKING_STATUS_INVALID"
    - "[ ] Отмена EXPIRED бронирования → BOOKING_STATUS_INVALID"
    - "[ ] BOOKING_NOT_FOUND"
    - "[ ] Старт аренды по CANCELLED → BOOKING_STATUS_INVALID"
