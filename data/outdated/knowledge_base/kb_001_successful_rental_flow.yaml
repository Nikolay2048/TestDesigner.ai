# ═══════════════════════════════════════════════════════════════════════
# KB-001 — Полный флоу успешной аренды автомобиля
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-001
title: "Успешная аренда автомобиля — полный happy-path флоу"
type: positive
category: rental_full_flow
chain_id: POS-001

source_files:
  business_requirements: "data/cases/case_001_successful_rental_flow/01_business_requirements.md"
  system_analysis: "data/cases/case_001_successful_rental_flow/02_system_analysis.md"
  openapi: "data/cases/case_001_successful_rental_flow/03_openapi.yaml"
  flk_rules: "data/cases/case_001_successful_rental_flow/04_flk_rules.yaml"
  status_matrix: "data/cases/case_001_successful_rental_flow/05_status_transition_matrix.yaml"

summary: >
  Сценарий описывает полный backend-процесс: проверка пользователя → проверка ВУ →
  поиск авто → создание бронирования → старт аренды → телеметрия → завершение аренды →
  расчёт стоимости → создание платежа → успешное списание → квитанция.
  Все 18 шагов из system_analysis.md должны покрываться тест-кейсами.

business_goals:
  - "Клиент с подтверждённым профилем и действующим ВУ может пройти полный цикл аренды"
  - "После бронирования авто недоступно для других клиентов"
  - "После завершения аренды авто возвращается в AVAILABLE"
  - "Платёж списывается один раз — повторное списание запрещено"
  - "Недоступность notification-сервиса не отменяет успешный платёж"

# ─── Предусловия (seed-состояние после POST /mock/reset) ────────────────
preconditions:
  setup_call: "POST /mock/reset"
  seed_state:
    user: "user-verified → VERIFIED, ВУ действует (expires +3 года), payment_method активен"
    vehicle: "vehicle-available-4 → AVAILABLE (не занято бронированиями)"
    bookings: "нет активных бронирований для user-verified + vehicle-available-4"
    rentals: "нет активных аренд для user-verified"
    payments: "нет платежей"
    mock_config:
      geo_service_available: true
      payment_provider_available: true
      telemetry_service_available: true

# ─── Цепочка API — happy path ────────────────────────────────────────────
api_chain:
  - step: 1
    name: "Получение и верификация пользователя"
    method: GET
    path: /v1/users/user-verified
    expected_status: 200
    assert:
      - "response.userId == 'user-verified'"
      - "response.status == 'VERIFIED'"

  - step: 2
    name: "Проверка водительского удостоверения"
    method: GET
    path: /v1/users/user-verified/driver-license
    expected_status: 200
    assert:
      - "response.status == 'VERIFIED'"
      - "response.expiration_date > today()"

  - step: 3
    name: "Получение списка доступных автомобилей"
    method: GET
    path: /v1/vehicles/available
    expected_status: 200
    assert:
      - "response.count >= 1"
      - "vehicle-available-4 присутствует в response.items"
      - "все items имеют status == AVAILABLE"

  - step: 4
    name: "Получение данных конкретного автомобиля"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'AVAILABLE'"
      - "response.available_for_booking == true"

  - step: 5
    name: "Создание бронирования"
    method: POST
    path: /v1/bookings
    request_body: {userId: "user-verified", vehicleId: "vehicle-available-4"}
    expected_status: 201
    assert:
      - "response.status == 'CONFIRMED'"
      - "response.userId == 'user-verified'"
      - "response.vehicleId == 'vehicle-available-4'"
      - "response.bookingId не пустой"
      - "response.expires_at > now()"
    extract: {bookingId: "response.bookingId"}

  - step: 6
    name: "Проверка статуса авто после бронирования"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'RESERVED'"
      - "response.available_for_booking == false"

  - step: 7
    name: "Проверка статуса бронирования"
    method: GET
    path: "/v1/bookings/{bookingId}"
    expected_status: 200
    assert:
      - "response.status == 'CONFIRMED'"
      - "response.expires_at > now()"

  - step: 8
    name: "Старт аренды"
    method: POST
    path: /v1/rentals/start
    request_body: {bookingId: "{bookingId}", userLocation: {lat: 55.75, lon: 37.62}}
    expected_status: 201
    assert:
      - "response.status == 'STARTED'"
      - "response.rentalId не пустой"
      - "response.bookingId == {bookingId}"
      - "response.vehicleId == 'vehicle-available-4'"
    extract: {rentalId: "response.rentalId"}

  - step: 9
    name: "Проверка статуса бронирования после старта"
    method: GET
    path: "/v1/bookings/{bookingId}"
    expected_status: 200
    assert:
      - "response.status == 'STARTED'"

  - step: 10
    name: "Проверка статуса авто во время аренды"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'IN_USE'"

  - step: 11
    name: "Получение состояния аренды с preliminary_amount"
    method: GET
    path: "/v1/rentals/{rentalId}"
    expected_status: 200
    assert:
      - "response.status == 'STARTED'"
      - "response.preliminary_amount >= 0"
      - "response.tariff_per_minute == 8.0"

  - step: 12
    name: "Телеметрия — установить корректное состояние перед завершением"
    method: PUT
    path: /v1/vehicles/vehicle-available-4/telemetry
    request_body: {engine_on: false, doors_closed: true, speed_kmh: 0}
    expected_status: 200
    assert:
      - "response.engine_on == false"
      - "response.doors_closed == true"
      - "response.speed_kmh == 0"

  - step: 13
    name: "Завершение аренды"
    method: POST
    path: "/v1/rentals/{rentalId}/finish"
    expected_status: 200
    assert:
      - "response.status == 'FINISHED'"
      - "response.amount > 0"
      - "response.total_minutes >= 1"
      - "response.finished_at не пустой"
    extract: {amount: "response.amount"}

  - step: 14
    name: "Проверка статуса авто после завершения"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'AVAILABLE'"

  - step: 15
    name: "Создание платежа"
    method: POST
    path: /v1/payments
    request_body: {rentalId: "{rentalId}", amount: "{amount}", currency: "RUB"}
    expected_status: 201
    assert:
      - "response.status == 'CAPTURED'"
      - "response.paymentId не пустой"
      - "response.amount == {amount}"
    extract: {paymentId: "response.paymentId"}

  - step: 16
    name: "Проверка статуса платежа"
    method: GET
    path: "/v1/payments/{paymentId}"
    expected_status: 200
    assert:
      - "response.status == 'CAPTURED'"

  - step: 17
    name: "Проверка статуса аренды — должна быть PAID"
    method: GET
    path: "/v1/rentals/{rentalId}"
    expected_status: 200
    assert:
      - "response.status == 'PAID'"

  - step: 18
    name: "Проверка outbox-событий"
    method: GET
    path: /mock/outbox
    expected_status: 200
    assert:
      - "outbox содержит BOOKING_CREATED"
      - "outbox содержит RENTAL_STARTED"
      - "outbox содержит RENTAL_FINISHED"
      - "outbox содержит VEHICLE_RELEASED"
      - "outbox содержит PAYMENT_CAPTURED"
      - "outbox содержит NOTIFICATION_REQUESTED"

  - step: 19
    name: "Проверка audit-лога"
    method: GET
    path: /mock/audit?entity_type=booking
    expected_status: 200
    assert:
      - "присутствует запись для bookingId"

# ─── ФЛК-правила и негативные тесты ──────────────────────────────────────
flk_rules:
  - id: FLK-USER-001
    endpoint: POST /v1/bookings
    condition: "userId не существует"
    test_input: {userId: "user-nonexistent", vehicleId: "vehicle-available-4"}
    expected_status: 404
    expected_error_code: USER_NOT_FOUND
    postconditions:
      - "vehicle-available-4 остаётся AVAILABLE"
      - "outbox НЕ содержит BOOKING_CREATED"

  - id: FLK-USER-003
    endpoint: POST /v1/bookings
    condition: "пользователь заблокирован"
    test_input: {userId: "user-blocked", vehicleId: "vehicle-available-4"}
    expected_status: 409
    expected_error_code: USER_BLOCKED
    postconditions:
      - "vehicle-available-4 остаётся AVAILABLE"

  - id: FLK-LICENSE-001
    endpoint: POST /v1/bookings
    condition: "ВУ просрочено (expiration_date = today - 1)"
    test_input: {userId: "user-expired-lic", vehicleId: "vehicle-available-4"}
    expected_status: 409
    expected_error_code: DRIVER_LICENSE_EXPIRED
    postconditions:
      - "vehicle-available-4 остаётся AVAILABLE"
      - "outbox НЕ содержит BOOKING_CREATED"

  - id: FLK-VEHICLE-001_RESERVED
    endpoint: POST /v1/bookings
    condition: "авто в статусе RESERVED"
    test_input: {userId: "user-verified", vehicleId: "vehicle-reserved"}
    expected_status: 409
    expected_error_code: VEHICLE_NOT_AVAILABLE

  - id: FLK-VEHICLE-001_IN_USE
    endpoint: POST /v1/bookings
    condition: "авто в статусе IN_USE"
    test_input: {userId: "user-verified", vehicleId: "vehicle-in-use"}
    expected_status: 409
    expected_error_code: VEHICLE_NOT_AVAILABLE

  - id: FLK-VEHICLE-001_MAINTENANCE
    endpoint: POST /v1/bookings
    condition: "авто на обслуживании"
    test_input: {userId: "user-verified", vehicleId: "vehicle-maintenance"}
    expected_status: 409
    expected_error_code: VEHICLE_NOT_AVAILABLE

  - id: FLK-VEHICLE-001_BLOCKED
    endpoint: POST /v1/bookings
    condition: "авто заблокировано"
    test_input: {userId: "user-verified", vehicleId: "vehicle-blocked"}
    expected_status: 409
    expected_error_code: VEHICLE_NOT_AVAILABLE

  - id: FLK-VEHICLE-NOT-FOUND
    endpoint: POST /v1/bookings
    condition: "авто не существует"
    test_input: {userId: "user-verified", vehicleId: "vehicle-nonexistent"}
    expected_status: 404
    expected_error_code: VEHICLE_NOT_FOUND

  - id: FLK-PAYMENT-001
    endpoint: POST /v1/payments
    condition: "повторная попытка оплаты уже CAPTURED аренды"
    note: "выполнить после успешного платежа в шаге 15"
    test_input: {rentalId: "{rentalId}", amount: "{amount}"}
    expected_status: 409
    expected_error_code: PAYMENT_OPERATION_DUPLICATE

  - id: FLK-GEO
    endpoint: POST /v1/rentals/start
    condition: "geo-service недоступен"
    setup: ["POST /mock/services/geo/disable"]
    test_input: {bookingId: "{bookingId}"}
    expected_status: 503
    expected_error_code: GEO_SERVICE_UNAVAILABLE
    teardown: ["POST /mock/services/geo/enable"]

# ─── Переходы статусов ─────────────────────────────────────────────────
status_transitions:
  - entity: vehicle
    transitions:
      - {from: AVAILABLE, to: RESERVED, trigger: "POST /v1/bookings → 201", verify: "GET /v1/vehicles/vehicle-available-4"}
      - {from: RESERVED, to: IN_USE, trigger: "POST /v1/rentals/start → 201", verify: "GET /v1/vehicles/vehicle-available-4"}
      - {from: IN_USE, to: AVAILABLE, trigger: "POST /v1/rentals/{id}/finish → 200", verify: "GET /v1/vehicles/vehicle-available-4"}

  - entity: booking
    transitions:
      - {from: null, to: CONFIRMED, trigger: "POST /v1/bookings → 201"}
      - {from: CONFIRMED, to: STARTED, trigger: "POST /v1/rentals/start → 201"}

  - entity: rental
    transitions:
      - {from: null, to: STARTED, trigger: "POST /v1/rentals/start → 201"}
      - {from: STARTED, to: FINISHED, trigger: "POST /v1/rentals/{id}/finish → 200"}
      - {from: FINISHED, to: PAID, trigger: "POST /v1/payments → 201 (CAPTURED)"}

  - entity: payment
    transitions:
      - {from: null, to: CAPTURED, trigger: "POST /v1/payments → 201 (provider ok)"}

# ─── Outbox-события ────────────────────────────────────────────────────
expected_outbox_events:
  - {event_type: BOOKING_CREATED, trigger: "POST /v1/bookings → 201", verify: "GET /mock/outbox?type=BOOKING_CREATED"}
  - {event_type: RENTAL_STARTED, trigger: "POST /v1/rentals/start → 201", verify: "GET /mock/outbox?type=RENTAL_STARTED"}
  - {event_type: RENTAL_FINISHED, trigger: "POST /v1/rentals/{id}/finish → 200", verify: "GET /mock/outbox?type=RENTAL_FINISHED"}
  - {event_type: VEHICLE_RELEASED, trigger: "POST /v1/rentals/{id}/finish → 200", verify: "GET /mock/outbox?type=VEHICLE_RELEASED"}
  - {event_type: PAYMENT_CAPTURED, trigger: "POST /v1/payments → 201 (success)", verify: "GET /mock/outbox?type=PAYMENT_CAPTURED"}
  - {event_type: NOTIFICATION_REQUESTED, trigger: "после PAYMENT_CAPTURED", verify: "GET /mock/outbox?type=NOTIFICATION_REQUESTED"}

negative_events_must_not_appear:
  - "BOOKING_CREATED не должен появляться при отклонённых запросах"
  - "PAYMENT_CAPTURED не должен появляться при FAILED платеже"

# ─── Техники тест-дизайна ──────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    valid_class:
      - "user-verified (VERIFIED) + vehicle-available-4 (AVAILABLE) → 201"
    invalid_classes:
      - "user-nonexistent + any vehicle → 404 USER_NOT_FOUND"
      - "user-blocked + any vehicle → 409 USER_BLOCKED"
      - "user-expired-lic + any vehicle → 409 DRIVER_LICENSE_EXPIRED"
      - "any valid user + vehicle-reserved → 409 VEHICLE_NOT_AVAILABLE"
      - "any valid user + vehicle-in-use → 409 VEHICLE_NOT_AVAILABLE"
      - "any valid user + vehicle-maintenance → 409 VEHICLE_NOT_AVAILABLE"
      - "any valid user + vehicle-blocked → 409 VEHICLE_NOT_AVAILABLE"
      - "any valid user + vehicle-nonexistent → 404 VEHICLE_NOT_FOUND"

  boundary_value_analysis:
    - field: "booking TTL"
      values:
        - "expires_at > now() → CONFIRMED (valid)"
        - "expires_at < now() → BOOKING_EXPIRED (при старте аренды)"
      seed_for_expired: "booking-to-expire (expires_at в прошлом)"
    - field: "payment amount"
      values:
        - "amount > 0 → 201"
        - "amount = 0 → 422 PAYMENT_AMOUNT_INVALID"
        - "amount < 0 → 422 PAYMENT_AMOUNT_INVALID"

  state_transition:
    happy_path: "AVAILABLE → RESERVED → IN_USE → AVAILABLE"
    forbidden_paths:
      - "MAINTENANCE → IN_USE (нельзя арендовать авто на обслуживании)"
      - "BLOCKED → RESERVED (нельзя забронировать заблокированное авто)"

  decision_table:
    title: "POST /v1/bookings — матрица условий и результатов"
    conditions:
      C1_user_status: [VERIFIED, BLOCKED, NEW, nonexistent]
      C2_license_valid: [valid, expired, not_found]
      C3_vehicle_status: [AVAILABLE, RESERVED, IN_USE, MAINTENANCE, BLOCKED, nonexistent]
    key_outcomes:
      - "C1=VERIFIED, C2=valid, C3=AVAILABLE → 201 CONFIRMED"
      - "C1=nonexistent, any, any → 404 USER_NOT_FOUND"
      - "C1=BLOCKED, any, any → 409 USER_BLOCKED"
      - "C1=VERIFIED, C2=expired, C3=AVAILABLE → 409 DRIVER_LICENSE_EXPIRED"
      - "C1=VERIFIED, C2=valid, C3=RESERVED → 409 VEHICLE_NOT_AVAILABLE"
      - "C1=VERIFIED, C2=valid, C3=IN_USE → 409 VEHICLE_NOT_AVAILABLE"
      - "C1=VERIFIED, C2=valid, C3=MAINTENANCE → 409 VEHICLE_NOT_AVAILABLE"
      - "C1=VERIFIED, C2=valid, C3=BLOCKED → 409 VEHICLE_NOT_AVAILABLE"
      - "C1=VERIFIED, C2=valid, C3=nonexistent → 404 VEHICLE_NOT_FOUND"

# ─── Чеклист покрытия ─────────────────────────────────────────────────
coverage_checklist:
  positive:
    - "[ ] Полный happy-path флоу (шаги 1–19)"
    - "[ ] Статус авто = RESERVED после бронирования"
    - "[ ] Статус авто = IN_USE после старта"
    - "[ ] Статус авто = AVAILABLE после завершения"
    - "[ ] preliminary_amount возвращается при STARTED"
    - "[ ] amount > 0 после завершения"
    - "[ ] Платёж CAPTURED при доступном провайдере"
    - "[ ] Статус аренды = PAID после платежа"
  negative:
    - "[ ] USER_NOT_FOUND (404)"
    - "[ ] USER_BLOCKED (409)"
    - "[ ] DRIVER_LICENSE_EXPIRED (409)"
    - "[ ] VEHICLE_NOT_FOUND (404)"
    - "[ ] VEHICLE_NOT_AVAILABLE — RESERVED (409)"
    - "[ ] VEHICLE_NOT_AVAILABLE — IN_USE (409)"
    - "[ ] VEHICLE_NOT_AVAILABLE — MAINTENANCE (409)"
    - "[ ] VEHICLE_NOT_AVAILABLE — BLOCKED (409)"
    - "[ ] PAYMENT_OPERATION_DUPLICATE (409)"
    - "[ ] GEO_SERVICE_UNAVAILABLE (503)"
  outbox:
    - "[ ] BOOKING_CREATED присутствует"
    - "[ ] RENTAL_STARTED присутствует"
    - "[ ] RENTAL_FINISHED присутствует"
    - "[ ] VEHICLE_RELEASED присутствует"
    - "[ ] PAYMENT_CAPTURED присутствует"
    - "[ ] NOTIFICATION_REQUESTED присутствует"
    - "[ ] Нет лишних событий при отклонённых запросах"
  state_integrity:
    - "[ ] Авто не изменяет статус при отклонённом бронировании"
    - "[ ] Один и тот же rental нельзя оплатить дважды"
