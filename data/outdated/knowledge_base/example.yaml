scenario_id: TC-001
name: "Получение фото авто до аренды"
business_req: BR-12, BR-15
sa_artifacts: UC-001
microservice: ms-rents
swagger-spec:
  - swagger01.yaml
precondition-scenario:
  - TC-000:
      get:
        - token: $response.accessToken
  - TC-001:
      get:
        -$response.file.id
        -$response.file/name
triggered_scenario:
  - TC-001
  - TC-002
caller_scenario:
  - TC-001
  - TC-002
steps:
  - step: 1
    description: "Получение фото авто до аренды"
    depends_on_scenario:
      - TC-001
      - TC-002
    triggered_scenario:
      - TC-001
      - TC-002
    api_call: POST /auth/login
    api_model: "боди и параметры из сваггер"
    get:
      -$response.rent.id
    flk:
      - code: RENT_NOT_FOUND
        condition: "rent.id не существует"
        http_status: 404
        message: "Аренда не найдена"
      - code: UNAUTHORIZED
        condition: "token отсутствует или истёк"
        http_status: 401
        message: "Нет доступа"
      - code: PHOTO_NOT_READY
        condition: "фото ещё не загружено системой"
        http_status: 409
        message: "Фото недоступно"
  - step: 2
    type: KAFKA
    topic: rent.photo.uploaded
    produces: event.photoId

  - step: 3
    type: DB_CHECK
    query: "SELECT * FROM photos WHERE rent_id = ?"
    purpose: "проверить что фото сохранилось"
