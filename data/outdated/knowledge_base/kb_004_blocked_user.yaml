# ═══════════════════════════════════════════════════════════════════════
# KB-004 — Попытка аренды заблокированным пользователем
# ═══════════════════════════════════════════════════════════════════════

card_id: KB-004
title: "Отказ в бронировании и аренде для заблокированного пользователя"
type: negative
category: user_block
chain_id: NEG-004

source_files:
  business_requirements: "data/cases/case_004_rental_by_blocked_user/01_business_requirements.md"
  system_analysis: "data/cases/case_004_rental_by_blocked_user/02_system_analysis.md"
  openapi: "data/cases/case_004_rental_by_blocked_user/03_openapi.yaml"
  flk_rules: "data/cases/case_004_rental_by_blocked_user/04_flk_rules.yaml"
  status_matrix: "data/cases/case_004_rental_by_blocked_user/05_status_transition_matrix.yaml"

summary: >
  Пользователь в статусе BLOCKED не может создавать бронирования.
  USER_BLOCKED — первая проверка пользователя после USER_NOT_FOUND.
  При отказе авто не резервируется, booking не создаётся, BOOKING_CREATED не публикуется.
  Несуществующий userId → 404 USER_NOT_FOUND.
  Контраст: user-verified (VERIFIED) → 201.

business_goals:
  - "Заблокированный пользователь лишается доступа ко всем операциям бронирования/аренды"
  - "Блокировка проверяется до проверки ВУ и платёжного метода"
  - "После блокировки авто возвращается другим пользователям"

preconditions:
  setup_call: "POST /mock/reset"
  seed_state:
    user_blocked:
      id: "user-blocked"
      status: BLOCKED
      driver_license: {status: REJECTED}
      payment_method: "отсутствует"
    vehicle_available_4: {status: AVAILABLE}
    note: "user-verified остаётся доступным для контрастного теста"

api_chain:
  - step: 1
    name: "Получить данные заблокированного пользователя"
    method: GET
    path: /v1/users/user-blocked
    expected_status: 200
    assert:
      - "response.status == 'BLOCKED'"

  - step: 2
    name: "Попытка бронирования заблокированным пользователем → 409 USER_BLOCKED"
    method: POST
    path: /v1/bookings
    request_body: {userId: "user-blocked", vehicleId: "vehicle-available-4"}
    expected_status: 409
    assert:
      - "response.error == 'USER_BLOCKED'"
      - "response.message не пустой"

  - step: 3
    name: "Авто осталось AVAILABLE"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'AVAILABLE'"

  - step: 4
    name: "Outbox НЕ содержит BOOKING_CREATED для user-blocked"
    method: GET
    path: "/mock/outbox?type=BOOKING_CREATED"
    expected_status: 200
    assert:
      - "нет события BOOKING_CREATED с userId == 'user-blocked'"

  - step: 5
    name: "Несуществующий userId → 404 USER_NOT_FOUND"
    method: POST
    path: /v1/bookings
    request_body: {userId: "user-nonexistent", vehicleId: "vehicle-available-4"}
    expected_status: 404
    assert:
      - "response.error == 'USER_NOT_FOUND'"

  - step: 6
    name: "GET несуществующего пользователя → 404"
    method: GET
    path: /v1/users/user-nonexistent
    expected_status: 404
    assert:
      - "response.error == 'USER_NOT_FOUND'"

  - step: 7
    name: "Контраст: user-verified → 201 CONFIRMED"
    method: POST
    path: /v1/bookings
    request_body: {userId: "user-verified", vehicleId: "vehicle-available-4"}
    expected_status: 201
    assert:
      - "response.status == 'CONFIRMED'"
    extract: {bookingId: "response.bookingId"}

  - step: 8
    name: "Авто теперь RESERVED для user-verified"
    method: GET
    path: /v1/vehicles/vehicle-available-4
    expected_status: 200
    assert:
      - "response.status == 'RESERVED'"

# ─── ФЛК-правила ─────────────────────────────────────────────────────
flk_rules:
  - id: FLK-USER-001
    endpoint: POST /v1/bookings
    condition: "userId не существует"
    test_input: {userId: "user-nonexistent", vehicleId: "vehicle-available-4"}
    expected_status: 404
    expected_error_code: USER_NOT_FOUND
    note: "Проверяется первым"

  - id: FLK-USER-003
    endpoint: POST /v1/bookings
    condition: "user.status == BLOCKED"
    test_input: {userId: "user-blocked", vehicleId: "vehicle-available-4"}
    expected_status: 409
    expected_error_code: USER_BLOCKED
    note: "Проверяется до USER_NOT_VERIFIED"
    postconditions:
      - "vehicle статус не изменяется"
      - "BOOKING_CREATED не в outbox"

  - id: FLK-USER-002
    endpoint: POST /v1/bookings
    condition: "user.status != VERIFIED (NEW, SUSPENDED, FRAUD_CHECK)"
    note: "Нет прямого seed-ID для NEW/SUSPENDED. Можно проверить через user-blocked (BLOCKED → USER_BLOCKED раньше)"
    expected_status: 409
    expected_error_code: USER_NOT_VERIFIED

# ─── Переходы статусов ─────────────────────────────────────────────────
status_transitions:
  - entity: vehicle
    note: "При USER_BLOCKED авто НЕ меняет статус — остаётся AVAILABLE"
  - entity: user
    note: "BLOCKED → VERIFIED возможен только через ручную разблокировку (не через API в данном сценарии)"

expected_outbox_events:
  must_not_appear:
    - "BOOKING_CREATED (при USER_BLOCKED)"

# ─── Техники тест-дизайна ─────────────────────────────────────────────
test_design_techniques:
  equivalence_partitioning:
    user_status_classes:
      - "VERIFIED → бронирование разрешено (при других условиях)"
      - "BLOCKED → 409 USER_BLOCKED"
      - "nonexistent → 404 USER_NOT_FOUND"
      - "NEW/SUSPENDED/FRAUD_CHECK → 409 USER_NOT_VERIFIED"

  priority_order:
    description: "Порядок проверок пользователя при POST /v1/bookings"
    order:
      1: "USER_NOT_FOUND (404)"
      2: "USER_BLOCKED (409)"
      3: "USER_NOT_VERIFIED (409)"
      4: "USER_HAS_CRITICAL_DEBT (409)"
      5: "USER_HAS_ACTIVE_RENTAL (409)"
      6: "DRIVER_LICENSE_EXPIRED (409)"
      7: "PAYMENT_METHOD_NOT_FOUND (409)"
      8: "VEHICLE_NOT_AVAILABLE (409)"

coverage_checklist:
  negative:
    - "[ ] USER_BLOCKED → 409 (seed: user-blocked)"
    - "[ ] USER_NOT_FOUND → 404 (userId = 'user-nonexistent')"
  state_integrity:
    - "[ ] vehicle-available-4 остаётся AVAILABLE после отказа"
    - "[ ] BOOKING_CREATED не в outbox после отказа"
  positive:
    - "[ ] user-verified → 201 (контрастный тест)"
    - "[ ] после успешного бронирования авто = RESERVED"
