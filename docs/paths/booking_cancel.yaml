post:
  summary: Cancel booking
  operationId: cancelBooking

  parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        example: booking-1

  responses:
    "200":
      description: Booking cancelled
      content:
        application/json:
          schema:
            $ref: "../schemas/BookingResponse.yaml"

    "404":
      description: Booking not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"

    "409":
      description: Booking cannot be cancelled
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
