openapi: 3.0.3
info:
  title: Carsharing Mock API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /v1/vehicles/available:
    $ref: "./paths/vehicles_available.yaml"

  /v1/bookings:
    $ref: "./paths/bookings.yaml"

  /v1/bookings/{bookingId}:
    $ref: "./paths/booking_by_id.yaml"

  /v1/bookings/{bookingId}/cancel:
    $ref: "./paths/booking_cancel.yaml"

components:
  schemas:
    Vehicle:
      $ref: "./schemas/Vehicle.yaml"

    AvailableVehiclesResponse:
      $ref: "./schemas/AvailableVehiclesResponse.yaml"

    CreateBookingRequest:
      $ref: "./schemas/CreateBookingRequest.yaml"

    BookingResponse:
      $ref: "./schemas/BookingResponse.yaml"

    ErrorResponse:
      $ref: "./schemas/ErrorResponse.yaml"
